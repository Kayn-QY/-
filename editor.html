<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极氪日播间排班 · 在线编辑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-deep: #0a1b33;
  --ink-2: #1e3a5f;
  --clay: #905831;
  --clay-2: #c07a4a;
  --peach: #ffd9b8;
  --text-main: #1f2c44;
  --text-muted: #4a5a72;
  --font-sans: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-display: "Outfit", "PingFang SC", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}
body{
  font-family:var(--font-sans);color:var(--text-main);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(144,88,49,.28), transparent 55%),
    radial-gradient(1000px 600px at 110% 30%, rgba(10,27,51,.35), transparent 55%),
    linear-gradient(160deg, #c9d3e2 0%, #aebbd0 40%, #d8dee8 100%);
  background-attachment:fixed;
}
/* 内容区 */
.content{position:relative;z-index:2;max-width:1680px;margin:0 auto;padding:72px 32px 64px}
.glass-card{
  border-radius:28px;border:1px solid rgba(255,255,255,.6);
  background:linear-gradient(150deg, rgba(255,255,255,.56), rgba(255,255,255,.3));
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 30px 60px rgba(20,30,50,.2), inset 0 1px 0 rgba(255,255,255,.8);
  padding:24px;animation:rise .6s cubic-bezier(.16,1,.3,1) both;
}
.card-head{margin-bottom:16px}
.card-head h1{font-family:var(--font-display);font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-.01em;line-height:1.15;color:#0f1e3d}
.card-head .sub{margin-top:6px;font-size:13px;color:var(--text-muted)}
.card-head .sub time{color:var(--text-main);font-weight:500}
/* 直播间切换（编辑页顶部） */
.room-switch{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:16px}
.room-switch-label{font-size:12px;color:var(--text-muted);margin-right:4px}
.room-tab-editor{
  position:relative;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5);color:#334155;
  border-radius:12px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:inset 0 1px 0 #fff;transition:all .2s;font-family:var(--font-sans);white-space:nowrap;
}
.room-tab-del{
  display:none;position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:#c0392b;color:#fff;font-size:13px;line-height:18px;text-align:center;cursor:pointer;
  font-style:normal;user-select:none;box-shadow:0 2px 6px rgba(192,57,43,.4);
}
.room-tab-editor:hover .room-tab-del{display:block}
.room-tab-del:hover{background:#a93226}
.room-tab-editor:hover{background:rgba(255,255,255,.75)}
.room-tab-editor.active{
  background:linear-gradient(135deg, #0a1b33, #1e3a5f);color:#fff;border-color:transparent;
  box-shadow:0 8px 18px rgba(10,27,51,.35);
}
.room-tab-add{
  display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border:1px dashed rgba(144,88,49,.6);background:rgba(255,255,255,.35);color:var(--clay);
  border-radius:12px;font-size:18px;line-height:1;cursor:pointer;transition:all .2s;font-family:var(--font-sans);
}
.room-tab-add:hover{background:rgba(144,88,49,.18);border-style:solid}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
#save-status{font-size:13px;color:var(--clay);min-height:18px;margin-top:12px}
#save-status.err{color:#c0392b}
.token-bar{
  background:linear-gradient(150deg, rgba(255,255,255,.56), rgba(255,255,255,.3));
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.65);border-radius:18px;
  box-shadow:0 16px 50px rgba(20,30,50,.12), inset 0 1px 0 rgba(255,255,255,.8);
  padding:18px 22px;margin:20px 0 0;max-width:880px;font-size:13px;color:var(--text-muted);
  display:none;position:relative;z-index:2;
}
.token-bar b{color:var(--text-main)}
.token-bar input{
  width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,.7);border-radius:999px;margin-top:10px;
  font-size:13px;background:rgba(255,255,255,.55);color:var(--text-main);outline:none;font-family:var(--font-sans);
  box-shadow:inset 0 1px 0 #fff;
}
.token-bar input:focus{border-color:var(--clay)}
.token-bar .token-actions{display:flex;gap:8px;margin-top:10px}
.token-bar button{
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.4);color:var(--text-main);
  border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--font-sans);transition:border-color .2s;
}
.token-bar button:hover{border-color:var(--clay)}
.token-bar button.btn-primary{
  background:linear-gradient(135deg, #0a1b33, #1e3a5f);color:#fafafa;border-color:transparent;font-weight:500;
  box-shadow:0 8px 18px rgba(10,27,51,.3);
}
.token-bar button.btn-primary:hover{background:linear-gradient(135deg, #12294a, #27486f)}
.board{margin-top:10px}
/* 表格：左右双容器方案A —— 左面板固定承载场次/角色，右侧独立横向滚动日期表 */
.schedule-wrap{
  display:flex;align-items:flex-start;gap:10px;
  border-radius:16px;background:rgba(240,246,255,.45);
}
/* 左面板：场次+角色固定，不随横向滚动移动，纵向与右侧一起滚动 */
.left-panel{
  flex:0 0 auto;width:194px;position:sticky;left:0;z-index:5;align-self:stretch;
  background:linear-gradient(150deg, rgba(244,248,255,.98), rgba(236,243,255,.96));
  border-radius:16px;border:1px solid rgba(255,255,255,.8);
  box-shadow:8px 0 16px -8px rgba(15,30,61,.22), 1px 0 0 rgba(15,30,61,.12);
}
.left-panel .left-table{width:100%;border-collapse:separate;border-spacing:6px;font-size:12.5px;table-layout:fixed}
/* 右侧：日期表横向滚动容器 */
.right-scroll{
  flex:1 1 auto;min-width:0;overflow-x:auto;
  border-radius:16px;background:rgba(255,255,255,.32);
}
.right-scroll #edit-table{
  width:100%;margin:0 auto;
  border-collapse:separate;border-spacing:6px;font-size:12.5px;table-layout:fixed;
}
/* 表头：左右统一固定高度（含删除本列占位），保证与左侧场次/角色面板逐行对齐 */
thead th{
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:12px;
  box-shadow:inset 0 1px 0 #fff;color:#1f2c44;font-weight:600;padding:10px 8px;white-space:nowrap;text-align:center;
  height:56px;vertical-align:middle;
}
.left-panel thead th{background:rgba(244,248,255,.98)}
.date-col{width:104px;color:var(--text-main);font-weight:500}
.date-col .wd{display:block;font-size:10px;color:var(--text-muted);font-weight:400;margin-top:2px}
.date-col.today{background:linear-gradient(135deg, #0a1b33, #1e3a5f);color:#fff;border-color:transparent}
.date-col.selected{background:linear-gradient(135deg, rgba(10,27,51,.14), rgba(30,58,95,.1));box-shadow:inset 0 0 0 1.5px rgba(10,27,51,.6)}
td.col-selected{background:rgba(10,27,51,.08);box-shadow:inset 0 0 0 1px rgba(10,27,51,.35)}
td{
  border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:8px 6px;text-align:center;
  color:#334155;vertical-align:middle;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 #fff;transition:background .15s;
  height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-slot td{border-top-color:rgba(255,255,255,.9)}
.slot-col{width:92px;color:#334155;font-weight:500}
.slot-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 8px;border-radius:999px;
  background:linear-gradient(135deg, #0a1b33, #1e3a5f);color:#fff;font-weight:600;font-size:11px;
  box-shadow:0 6px 14px rgba(10,27,51,.3);
}
.role-col{width:96px;color:var(--text-muted);font-size:11.5px;font-weight:500}
td.cell{min-width:92px;height:44px;outline:none;cursor:text}
td.cell:hover{background:rgba(255,255,255,.72)}
td.cell:focus{background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1.5px var(--clay)}
td.cell.anchor{color:#334155;font-weight:500}
td.cell.empty{color:rgba(31,44,68,.25)}
.board-note{margin-top:14px;font-size:12px;color:var(--text-muted);padding:0 6px 6px}
/* 复制粘贴解析预览弹窗 */
.paste-overlay{position:fixed;inset:0;z-index:99;background:rgba(10,27,51,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.paste-box{width:min(680px,92vw);max-height:84vh;overflow:auto;background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(255,255,255,.88));border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 30px 70px rgba(10,27,51,.4);padding:22px;font-family:var(--font-sans)}
.paste-box h3{margin-bottom:12px;color:#0f1e3d;font-size:16px}
.paste-box p.paste-desc{margin-bottom:10px;font-size:12px;color:var(--text-muted);line-height:1.6}
.paste-box textarea{width:100%;min-height:130px;border:1px solid rgba(15,30,61,.2);border-radius:12px;padding:10px 12px;font-size:13px;font-family:var(--font-sans);resize:vertical;outline:none;background:rgba(255,255,255,.7);box-sizing:border-box}
.paste-box .paste-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.paste-preview{margin-top:14px;border-top:1px solid rgba(15,30,61,.12);padding-top:12px;font-size:13px}
.paste-preview .row{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(15,30,61,.08)}
.paste-preview .row .idx{min-width:44px;color:var(--text-muted)}
.paste-preview .row .tm{min-width:120px;color:#0f1e3d;font-weight:600}
.paste-preview .row .nm{color:var(--clay)}
.paste-preview .row.err{color:#c0392b}
.paste-preview .row.err .tm,.paste-preview .row.err .nm{color:#c0392b}
.paste-preview .no-date{color:#c0392b;font-size:12px}
/* OCR 粘贴截图 */
.ocr-dropzone{
  margin-top:6px;border:1.5px dashed rgba(144,88,49,.5);border-radius:14px;background:rgba(255,255,255,.5);
  padding:26px 14px;text-align:center;font-size:13px;color:var(--text-muted);cursor:pointer;transition:all .2s;user-select:none;
}
.ocr-dropzone:hover,.ocr-dropzone.drag{border-color:var(--clay);background:rgba(144,88,49,.1)}
.ocr-progress{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12.5px;color:var(--text-muted)}
.ocr-progress .track{flex:1;height:8px;border-radius:999px;background:rgba(15,30,61,.1);overflow:hidden}
.ocr-progress .bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#905831,#c07a4a);transition:width .25s}
.ocr-progress span{white-space:nowrap;min-width:130px;text-align:right;font-variant-numeric:tabular-nums}
.paste-preview table{width:100%;border-collapse:collapse;font-size:12.5px}
.paste-preview th{padding:5px 6px;border:1px solid rgba(15,30,61,.12);text-align:center;background:rgba(15,30,61,.06);color:#0f1e3d}
.paste-preview td{padding:4px 5px;border:1px solid rgba(15,30,61,.12);text-align:center;vertical-align:middle}
.paste-preview td.editable{background:rgba(255,255,255,.55)}
.paste-preview input.cell-edit{
  width:100%;min-width:64px;border:1px solid transparent;border-radius:8px;padding:4px 6px;
  font-size:12.5px;font-family:var(--font-sans);text-align:center;background:transparent;color:#0f1e3d;outline:none;
}
.paste-preview input.cell-edit:hover{border-color:rgba(144,88,49,.35)}
.paste-preview input.cell-edit:focus{border-color:var(--clay);background:#fff;box-shadow:0 0 0 2px rgba(144,88,49,.15)}
.paste-preview input.cell-edit.invalid{border-color:#c0392b;background:rgba(192,57,43,.06);box-shadow:0 0 0 2px rgba(192,57,43,.12)}
.paste-preview td.tm-cell{color:#0f1e3d;font-weight:600}
.paste-preview td.missing{color:#c0392b;font-weight:600}
.foot{position:relative;z-index:2;text-align:center;color:rgba(31,44,68,.5);font-size:12px;letter-spacing:.10em;padding:28px 0 4px}
.btn-primary2{
  display:inline-flex;align-items:center;background:linear-gradient(135deg, #0a1b33, #1e3a5f);color:#fff;
  border:none;cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:500;
  letter-spacing:.02em;padding:12px 20px;border-radius:999px;text-decoration:none;
  transition:transform .15s;white-space:nowrap;box-shadow:0 10px 22px rgba(10,27,51,.3);
}
.btn-primary2:hover{transform:translateY(-1px)}
.btn-primary2:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{
  display:inline-flex;align-items:center;background:transparent;border:none;cursor:pointer;
  font-family:var(--font-sans);font-size:14px;font-weight:600;color:#0f1e3d;letter-spacing:.02em;
  text-decoration:none;transition:opacity .2s;white-space:nowrap;
}
.btn-ghost:hover{opacity:.6}
.btn-outline{
  display:inline-flex;align-items:center;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);
  color:var(--text-main);cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:500;
  border-radius:999px;padding:9px 16px;text-decoration:none;transition:border-color .2s,background .2s;white-space:nowrap;
  box-shadow:inset 0 1px 0 #fff;
}
.btn-outline:hover{border-color:rgba(144,88,49,.55);background:rgba(255,255,255,.65)}
.week-label{font-size:12.5px;font-weight:600;color:var(--text-main);white-space:nowrap;letter-spacing:.02em;display:inline-flex;align-items:center}
.btn-danger{
  display:inline-flex;align-items:center;background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.4);
  color:#c0392b;cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:500;
  border-radius:999px;padding:9px 16px;text-decoration:none;transition:background .2s;white-space:nowrap;
}
.btn-danger:hover{background:rgba(192,57,43,.2)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
  .content{padding:104px 16px 48px}
  .glass-card{padding:18px 14px;border-radius:20px}
}
@media (max-width:640px){
  .btn-primary2{padding:10px 14px;font-size:13px}
  .btn-ghost{display:inline-flex;font-size:12px;padding:8px 12px}
  .right-scroll #edit-table{min-width:800px}
}
</style>
</head>
<body>

<main class="content">
  <section class="glass-card">
    <header class="card-head">
      <h1>极氪日播间排班 · 在线编辑</h1>
      <p class="sub">切换直播间独立编辑 · 点击单元格直接修改 · 保存后自动更新公开网页（GitHub Pages 约 1~2 分钟后生效）</p>
      <div class="room-switch" id="room-switch">
        <span class="room-switch-label">直播间</span>
      </div>
      <div class="toolbar">
        <a class="btn-ghost" href="index.html">← 前往排班表</a>
        <button class="btn-outline" id="btn-prev-week">上周</button>
        <span class="week-label" id="week-label"></span>
        <button class="btn-outline" id="btn-next-week">下周</button>
        <button class="btn-outline" id="btn-clear-all">清除全部</button>
        <button class="btn-outline" id="btn-paste-parse">复制粘贴</button>
        <button class="btn-primary2" id="btn-save">保存并发布</button>
      </div>
      <div id="save-status"></div>
    </header>

    <div class="board">
      <div class="schedule-wrap">
        <div class="left-panel">
          <table class="left-table">
            <thead><tr id="left-thead-row"></tr></thead>
            <tbody id="left-tbody"></tbody>
          </table>
        </div>
        <div class="right-scroll">
          <table id="edit-table">
            <thead><tr id="thead-row"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="board-note">点击日期表头可选中该列（高亮） · 「清除全部」清空当前直播间全部数据</div>
    </div>
  </section>

  <div class="token-bar" id="token-bar">
    <div><b>首次保存需要 GitHub Token</b>（Fine-grained PAT，仅授权本仓库 Contents 读写权限）。Token 仅保存在当前浏览器的本地存储中，不会写入公开页面。换浏览器/设备需重新输入。</div>
    <input type="password" id="token-input" placeholder="粘贴 GitHub Token（ghp_ 或 github_pat_ 开头）">
    <div class="token-actions">
      <button class="btn-primary" id="btn-token-save">保存 Token</button>
      <button id="btn-token-clear">清除 Token</button>
    </div>
  </div>

  <footer class="foot">ZEEKR LIVE OPS CONSOLE · Marvis Schedule Reminder</footer>
</main>

<!-- PAGE_JS 模板：与 render_web.py 的 PAGE_JS 逐字节一致，由生成脚本注入 -->
<script type="text/plain" id="page-js-template">


"use strict";
var WEEKDAYS_JS = ["周日","周一","周二","周三","周四","周五","周六"];
var ROLES_JS = [["time","直播时间"],["car","直播车型"],["anchor","主播"]];
var SLOT_ORDER_JS = ["第1场","第2场","第3场","第4场","第5场","第6场"];
var MARQUEE_JS = ["Bilibili","GitHub","Vercel","Figma","Notion","Slack"];

var SCHEDULE = __SCHEDULE_JSON__;
var CFG = __CFG_JSON__;
var ROOMS = (CFG.rooms && CFG.rooms.length) ? CFG.rooms.slice() : Object.keys(SCHEDULE);
var CSS_TEMPLATE_JS = __CSS_TEMPLATE_JSON__;
var PAGE_JS_SRC = __PAGE_JS_JSON__;

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtD(d){ return d.slice(5).replace("-", "/"); }
function parseD(s){ var m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/); if (m) return new Date(+m[1], +m[2]-1, +m[3]); return null; }
function weekOf(d){ var dt = parseD(d); return dt ? WEEKDAYS_JS[dt.getDay()] : ""; }

var WEEK_START = null;
function pad2(n){ return n < 10 ? "0" + n : String(n); }
function bjNow(){
  var n = new Date();
  return new Date(n.getTime() + (n.getTimezoneOffset() + 480) * 60000);
}
function mondayOf(dt){
  var x = new Date(dt); x.setHours(0,0,0,0);
  var day = x.getDay();
  x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
  return x;
}
function thisMonday(){
  var n = bjNow();
  return mondayOf(new Date(n.getFullYear(), n.getMonth(), n.getDate()));
}
function weekDates(monday){
  var out = [];
  for (var i = 0; i < 7; i++){
    var x = new Date(monday); x.setDate(x.getDate() + i);
    out.push(pad2(x.getFullYear()) + "-" + pad2(x.getMonth()+1) + "-" + pad2(x.getDate()));
  }
  return out;
}
function todayISO(){
  var n = bjNow();
  return pad2(n.getFullYear()) + "-" + pad2(n.getMonth()+1) + "-" + pad2(n.getDate());
}
function weekLabel(){
  if (!WEEK_START) WEEK_START = thisMonday();
  var wd = weekDates(WEEK_START);
  return fmtD(wd[0]) + " ~ " + fmtD(wd[6]);
}
function shiftWeek(n){
  if (!WEEK_START) WEEK_START = thisMonday();
  WEEK_START = new Date(WEEK_START.getTime() + n * 7 * 86400000);
  renderAllTables();
}

function displayDatesFor(){
  if (!WEEK_START) WEEK_START = thisMonday();
  return weekDates(WEEK_START);
}

function renderAllTables(){
  var content = document.querySelector(".content");
  if (!content) return;
  var updatedAt = ((document.querySelector("#schedule .sub time") || {}).textContent || "");
  var parser = new DOMParser();
  var doc = parser.parseFromString(renderHtml(updatedAt), "text/html");
  var newContent = doc.querySelector(".content");
  if (newContent) content.replaceWith(newContent);
  initRoomPage();
}

function buildRoomTable(room){
  var dates = displayDatesFor();
  var today = todayISO();
  var data = SCHEDULE[room] || {};
  var dateHeader = dates.map(function(d){ return '<th class="date-col' + (d === today ? " today" : "") + '">' + fmtD(d) + '<span class="wd">' + weekOf(d) + '</span></th>'; }).join("");
  var leftRows = [];
  var rightRows = [];
  SLOT_ORDER_JS.forEach(function(slot){
    ROLES_JS.forEach(function(pair){
      var rk = pair[0], rn = pair[1];
      var cells = "";
      dates.forEach(function(d){
        var val = "";
        if (data[d] && data[d][slot] && data[d][slot][rk] !== undefined) val = data[d][slot][rk];
        if (val){
          var cls = "cell";
          if (rk === "anchor") cls = "cell anchor";
          else if (rk === "car") cls = "cell car";
          else if (rk === "time") cls = "cell time";
          cells += '<td class="' + cls + '">' + esc(val) + '</td>';
        } else {
          cells += '<td class="cell empty">·</td>';
        }
      });
      var rowLabel = rk === "time" ? '<span class="slot-badge">' + slot + '</span>' : "";
      var trCls = rk === "time" ? ' class="row-slot"' : "";
      leftRows.push('<tr' + trCls + '><td class="slot-col">' + rowLabel + '</td><td class="role-col">' + rn + '</td></tr>');
      rightRows.push('<tr' + trCls + '>' + cells + '</tr>');
    });
  });
  return '<div class="room-table" data-room="' + esc(room) + '"><div class="schedule-wrap"><div class="left-panel"><table class="left-table"><thead><tr><th class="col-slot">场次</th><th class="col-role">角色</th></tr></thead><tbody>' + leftRows.join("") + '</tbody></table></div><div class="right-scroll"><table class="right-table"><thead><tr>' + dateHeader + '</tr></thead><tbody>' + rightRows.join("") + '</tbody></table></div></div></div>';
}

function buildTabs(){
  return ROOMS.map(function(r, i){
    return '<button class="sheet-tab' + (i === 0 ? " active" : "") + '" data-room="' + esc(r) + '">' + esc(r) + '</button>';
  }).join("");
}

function buildStats(room){
  var data = SCHEDULE[room] || {};
  var counter = {};
  var today = todayISO();
  var day = data[today];
  if (day && typeof day === "object") {
    Object.keys(day).forEach(function(s){
      var n = (day[s].anchor || "").trim();
      if (n) counter[n] = (counter[n] || 0) + 1;
    });
  }
  var arr = Object.keys(counter).map(function(n){ return '<span class="chip">主播 <b>' + esc(n) + '</b> × ' + counter[n] + ' 场</span>'; });
  if (arr.length) return arr.join("");
  return room === "问我我"
    ? '<a class="chip chip-edit" href="editor.html" target="_blank">在线编辑</a>'
    : '<span class="chip">今日暂无</span>';
}

function clockMin(t){
  var m = String(t).match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1]) * 60 + (+m[2]) : -1;
}
/* 未来最近一场：当天无剩余场次自动取之后最近一天首场 */
function nextRemind(room){
  var data = SCHEDULE[room] || {};
  var now = bjNow();
  var best = null;
  var dates = Object.keys(data).sort();
  for (var i = 0; i < dates.length; i++){
    var d = dates[i];
    var day = data[d];
    if (!day || typeof day !== "object") continue;
    for (var j = 0; j < SLOT_ORDER_JS.length; j++){
      var slot = SLOT_ORDER_JS[j];
      var info = day[slot] || {};
      var mm = clockMin(info.time);
      if (mm < 0) continue;
      var start = new Date(+d.slice(0,4), +d.slice(5,7) - 1, +d.slice(8,10), Math.floor(mm / 60), mm % 60);
      if (start <= now) continue;
      if (!best || start < best.start) best = { start: start, slot: slot, anchor: (info.anchor || "").trim() };
    }
  }
  return best;
}
function countdownText(start){
  var diffMin = Math.round((start - bjNow()) / 60000);
  if (diffMin < 1) return "即将开播";
  if (diffMin < 60) return diffMin + "分钟后";
  var h = diffMin / 60;
  if (h < 24) return (Math.round(h * 10) / 10) + "小时后";
  var d = Math.floor(h / 24);
  return d + "天后";
}
function buildRemind(){
  var items = [];
  ROOMS.forEach(function(room){
    var b = nextRemind(room);
    if (!b){
      items.push('<div class="hero-remind-item"><span class="hero-remind-room">' + esc(room) + '</span><div class="hero-remind-info"><span class="hero-remind-slot">暂无排班</span><span class="hero-remind-name off">暂无数据</span></div><span class="hero-remind-time">—</span></div>');
      return;
    }
    var st = b.slot + " " + pad2(b.start.getHours()) + ":" + pad2(b.start.getMinutes());
    var cd = countdownText(b.start);
    if (b.anchor){
      items.push('<div class="hero-remind-item"><span class="hero-remind-room">' + esc(room) + '</span><div class="hero-remind-info"><span class="hero-remind-slot">' + st + '</span><span class="hero-remind-name">' + esc(b.anchor) + '</span></div><span class="hero-remind-time">' + cd + '</span></div>');
    } else {
      items.push('<div class="hero-remind-item"><span class="hero-remind-room">' + esc(room) + '</span><div class="hero-remind-info"><span class="hero-remind-slot">' + st + '</span><span class="hero-remind-name off">无人播</span></div><span class="hero-remind-time">' + cd + '</span></div>');
    }
  });
  if (!items.length) return '<div class="remind-empty">各直播间暂无排班数据，添加后自动生成提醒</div>';
  return '<div class="hero-remind-list">' + items.join("") + '</div>';
}
function updateRemind(){
  var el = document.getElementById("reminder");
  if (!el) return;
  var list = el.querySelector(".hero-remind-list");
  var html = buildRemind();
  if (list) list.outerHTML = html;
  else el.insertAdjacentHTML("beforeend", html);
}

function renderHtml(updatedAt){
  var roomTables = ROOMS.map(buildRoomTable).join("");
  var tabs = buildTabs();
  var statsAll = ROOMS.map(function(r, i){
    return '<div class="stats" data-stats-for="' + esc(r) + '"' + (i === 0 ? "" : ' style="display:none"') + '>' + buildStats(r) + '</div>';
  }).join("");
  var marqueeItems = MARQUEE_JS.map(function(it){ return '<span>' + it + '</span>'; }).join("");
  var marquee = '<div class="marquee"><div class="marquee-track">' + marqueeItems + marqueeItems + '</div></div>';
  var remindList = buildRemind();
  var h = "";
  h += '<!DOCTYPE html>\n';
  h += '<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
  h += '<title>极氪日播间排班 · 多直播间</title>\n';
  h += '<link rel="preconnect" href="https://fonts.googleapis.com">\n';
  h += '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n';
  h += '<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">\n';
  h += '<style>__CSS_TEMPLATE__</style>\n</head>\n<body>\n';
  h += '<main class="content">\n';
  h += '  <section class="hero" id="top">\n    <div class="hero-body">\n      <div class="hero-inner">\n';
  h += '      <div class="hero-eyebrow">Schedule Reminder · ZEEKR Daily Live</div>\n';
  h += '      <h1>极氪日播间排班</h1>\n';
  h += '      <p class="hero-sub">' + ROOMS.join(" · ") + ' · 多直播间独立排班</p>\n';
  h += '      <div class="hero-actions">\n        <a class="btn-primary" href="#schedule">查看排班</a>\n        <a class="btn-glass" href="editor.html" target="_blank">在线编辑</a>\n      </div>\n      </div>\n';
  h += '      <aside class="hero-remind" id="reminder">\n        <div class="hero-remind-head">\n          <span class="hero-remind-title">最近排班提醒</span>\n          <span class="hero-remind-badge">全部直播间</span>\n        </div>\n        ' + remindList + '\n      </aside>\n    </div>\n  </section>\n';
  h += '  ' + marquee + '\n';
  h += '  <div class="cards-grid">\n';
  h += '    <section class="glass-card" id="schedule">\n      <header class="card-head">\n';
  h += '        <div>\n          <h2>排班表</h2>\n          <p class="sub">数据更新 <time>' + esc(updatedAt) + '</time></p>\n        </div>\n';
  h += '        <div class="head-right">\n          <div class="week-nav">\n            <button class="week-btn" id="btn-prev-week">‹ 上周</button>\n            <span class="week-label" id="week-label">' + weekLabel() + '</span>\n            <button class="week-btn" id="btn-next-week">下周 ›</button>\n          </div>\n          <div class="sheet-bar" id="sheet-bar">' + tabs + '</div>\n          <div class="stats-wrap">' + statsAll + '</div>\n        </div>\n      </header>\n';
  h += '      <div class="room-tables">' + roomTables + '</div>\n    </section>\n  </div>\n';
  h += '  <div class="note" id="help">\n';
  h += '    <span>深蓝为主播 · 赤陶为车型 · 圆点为未排班（周末/节假日/未填写）</span>\n';
  h += '    <span class="tag">Frosted 3D Style · Marvis Schedule</span>\n  </div>\n';
  h += '</main>\n';
  h += '<script>__PAGE_JS__</' + 'script>\n';
  h += '</body>\n</html>';
  return h;
}

function switchRoom(room){
  document.querySelectorAll(".sheet-tab").forEach(function(t){ t.classList.toggle("active", t.dataset.room === room); });
  document.querySelectorAll(".room-table").forEach(function(t){ t.classList.toggle("active", t.dataset.room === room); });
  document.querySelectorAll("[data-stats-for]").forEach(function(s){ s.style.display = (s.dataset.statsFor === room) ? "" : "none"; });
}

function ghGetSha(path){
  var token = (localStorage.getItem("gh_token") || "").trim();
  return fetch("https://api.github.com/repos/Kayn-QY/-/contents/" + path, { headers: { Authorization: "Bearer " + token } })
    .then(function(r){ if (!r.ok) { if (r.status === 404) return null; throw new Error("获取 " + path + " 失败: HTTP " + r.status); } return r.json(); })
    .then(function(j){ return j ? j.sha : null; });
}
function ghPut(path, content){
  return ghGetSha(path).then(function(sha){
    var body = { message: "在线编辑排班表", content: btoa(unescape(encodeURIComponent(content))) };
    if (sha) body.sha = sha;
    return fetch("https://api.github.com/repos/Kayn-QY/-/contents/" + path, {
      method: "PUT",
      headers: { Authorization: "Bearer " + (localStorage.getItem("gh_token") || "").trim(), "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      if (!r.ok) { throw new Error("更新 " + path + " 失败: HTTP " + r.status); }
    });
  });
}

function addRoom(){
  var name = prompt("输入新直播间名称：");
  if (!name) return;
  var room = name.trim();
  if (!room) { alert("直播间名称不能为空"); return; }
  if (ROOMS.indexOf(room) >= 0) { alert("直播间「" + room + "」已存在"); return; }
  var token = (localStorage.getItem("gh_token") || "").trim();
  if (!token) { alert("新增直播间需要 GitHub Token（请先在在线编辑器保存 Token 后重试）。"); window.open("editor.html", "_blank"); return; }
  SCHEDULE[room] = {};
  CFG.rooms = ROOMS.concat([room]);
  ROOMS = CFG.rooms.slice();
  var now = new Date();
  var pad = function(n){ return String(n).padStart(2, "0"); };
  var updatedAt = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
  var html = renderHtml(updatedAt).replace("__CSS_TEMPLATE__", CSS_TEMPLATE_JS).replace("__PAGE_JS__", PAGE_JS_SRC);
  ghPut("schedule.json", JSON.stringify(SCHEDULE, null, 2) + "\n")
    .then(function(){ return ghPut("config.json", JSON.stringify(CFG, null, 2) + "\n"); })
    .then(function(){ return ghPut("index.html", html); })
    .then(function(){ return ghPut("output/schedule.html", html); })
    .then(function(){ alert("已新增直播间「" + room + "」，刷新后生效"); location.reload(); })
    .catch(function(e){ alert("新增失败: " + e.message); });
}

function initRoomPage(){
  document.addEventListener("click", function(e){
    var tab = e.target.closest(".sheet-tab");
    if (tab) { switchRoom(tab.dataset.room); return; }
  });
  var pw = document.getElementById("btn-prev-week");
  if (pw) pw.addEventListener("click", function(){ shiftWeek(-1); });
  var nw = document.getElementById("btn-next-week");
  if (nw) nw.addEventListener("click", function(){ shiftWeek(1); });
  updateRemind();
  setInterval(updateRemind, 30000);
}
initRoomPage();

</script>

<script>
"use strict";
const REPO_OWNER = "Kayn-QY";
const REPO_NAME = "-";
const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
const WEEKDAYS = ["周日","周一","周二","周三","周四","周五","周六"];
const ROLES = [
  ["time", "直播时间"],
  ["car", "直播车型"],
  ["anchor", "主播"],
];
const SLOT_ORDER = ["第1场","第2场","第3场","第4场","第5场","第6场"];
const MARQUEE_ITEMS = ["Bilibili", "GitHub", "Vercel", "Figma", "Notion", "Slack"];
const DEFAULT_ROOMS = ["7X","8X","9X","猎装"];

let schedule = {};
let cfg = {};
let rooms = [];
let currentRoom = "7X";
let displayDates = [];
let selectedDate = "";

const PAGE_JS_TEMPLATE = document.getElementById("page-js-template").textContent;

function $(id){ return document.getElementById(id); }
function fmtDate(d){ return d.slice(5).replace("-", "/"); }
function parseDate(s){
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function bjNow(){ const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 480) * 60000); }
function mondayOf(dt){ const x = new Date(dt); x.setHours(0,0,0,0); const day = x.getDay(); x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day)); return x; }
function thisMonday(){ const n = bjNow(); return mondayOf(new Date(n.getFullYear(), n.getMonth(), n.getDate())); }
function weekDates(monday){ return [0,1,2,3,4,5,6].map(i => toISO(addDays(monday, i))); }
function todayISO(){ const n = bjNow(); return toISO(new Date(n.getFullYear(), n.getMonth(), n.getDate())); }
function weekLabelText(){ return displayDates.length ? `${fmtDate(displayDates[0])} ~ ${fmtDate(displayDates[6])}` : ""; }
function updateWeekLabel(){ const el = $("week-label"); if (el) el.textContent = weekLabelText(); }
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function jsSafe(o){ return JSON.stringify(o).replace(/</g, "\\u003c"); }

function migrateIfOld(data){
  if (!data || typeof data !== "object") return { "7X": {}, "8X": {}, "9X": {}, "猎装": {} };
  const keys = Object.keys(data);
  const isOld = keys.length > 0 && keys.some(k => String(k).includes("-")) && !keys.some(k => DEFAULT_ROOMS.includes(k));
  if (isOld) return { "7X": data, "8X": {}, "9X": {}, "猎装": {} };
  const out = Object.assign({}, data);
  DEFAULT_ROOMS.forEach(r => { if (!out[r] || typeof out[r] !== "object") out[r] = {}; });
  return out;
}

async function loadData(){
  try {
    const [sRes, cRes] = await Promise.all([
      fetch("schedule.json", {cache: "no-store"}),
      fetch("config.json", {cache: "no-store"}),
    ]);
    if (!sRes.ok) throw new Error("schedule.json 加载失败: " + sRes.status);
    schedule = migrateIfOld(await sRes.json());
    if (cRes.ok) cfg = await cRes.json();
    rooms = (cfg.rooms && cfg.rooms.length) ? cfg.rooms.slice() : Object.keys(schedule);
    rooms = rooms.filter(r => r && r !== "__proto__" && r !== "constructor");
    DEFAULT_ROOMS.forEach(r => { if (!rooms.includes(r)) rooms.push(r); });
    if (!rooms.length) rooms = DEFAULT_ROOMS.slice();
    if (!rooms.includes(currentRoom)) currentRoom = rooms[0];
    displayDates = weekDates(thisMonday());
    selectedDate = "";
  } catch (e) {
    schedule = { "7X": {}, "8X": {}, "9X": {}, "猎装": {} };
    rooms = DEFAULT_ROOMS.slice();
    currentRoom = "7X";
    displayDates = [];
    setStatus("数据加载失败（请确认是通过 https://kayn-qy.github.io/-/editor.html 访问）: " + e.message, true);
  }
}

function renderRoomSwitch(){
  const wrap = $("room-switch");
  let html = '<span class="room-switch-label">直播间</span>';
  rooms.forEach(r => {
    const delBtn = rooms.length > 1
      ? `<span class="room-tab-del" data-del-room="${escapeHtml(r)}" title="删除直播间">×</span>`
      : "";
    html += `<button class="room-tab-editor${r === currentRoom ? " active" : ""}" data-room="${escapeHtml(r)}">${escapeHtml(r)}${delBtn}</button>`;
  });
  html += '<button class="room-tab-add" id="btn-room-add" title="新增直播间">＋</button>';
  wrap.innerHTML = html;
}

function switchRoom(room){
  if (!rooms.includes(room)) return;
  currentRoom = room;
  renderRoomSwitch();
  renderTable();
  bindCells();
}

function addRoomEditor(){
  const name = prompt("输入新直播间名称：");
  if (!name) return;
  const room = name.trim();
  if (!room) { setStatus("直播间名称不能为空", true); return; }
  if (rooms.includes(room)) { setStatus("直播间「" + room + "」已存在", true); return; }
  rooms.push(room);
  schedule[room] = {};
  currentRoom = room;
  renderRoomSwitch();
  renderTable();
  bindCells();
  setStatus("已新增直播间「" + room + "」，点击「保存并发布」后线上生效", false);
}

function deleteRoomEditor(room){
  if (rooms.length <= 1) { setStatus("至少保留一个直播间，无法删除", true); return; }
  if (!confirm(`确认删除直播间「${room}」？将同时删除其全部排班数据并发布到线上。`)) return;
  rooms = rooms.filter(r => r !== room);
  delete schedule[room];
  if (currentRoom === room) currentRoom = rooms[0];
  cfg.rooms = rooms.slice();
  renderRoomSwitch();
  renderTable();
  bindCells();
  setStatus("已删除直播间「" + room + "」，正在保存并发布…", false);
  save();
}

function renderTable(){
  const data = schedule[currentRoom] || {};
  const today = todayISO();
  // 左面板：场次/角色两列（独立表格，纵向随外层滚动）
  let leftHead = '<th class="col-slot">场次</th><th class="col-role">角色</th>';
  $("left-thead-row").innerHTML = leftHead;
  // 右侧：日期表格
  let headHtml = "";
  displayDates.forEach((d, i) => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    headHtml += `<th class="date-col${d === today ? " today" : ""}${d === selectedDate ? " selected" : ""}" data-date="${d}">${fmtDate(d)}<span class="wd">${wd}</span></th>`;
  });
  $("thead-row").innerHTML = headHtml;

  let leftRows = "";
  let rightRows = "";
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn]) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (data[d] && data[d][slot] && data[d][slot][rk] !== undefined) ? data[d][slot][rk] : "";
        const cls = rk === "anchor" ? "cell anchor" : "cell" + (val ? "" : " empty");
        cells += `<td class="${cls}${d === selectedDate ? " col-selected" : ""}" contenteditable="true" data-date="${d}" data-slot="${slot}" data-role="${rk}">${escapeHtml(val)}</td>`;
      });
      const rowLabel = rk === "time" ? `<span class="slot-badge">${slot}</span>` : "";
      const trCls = rk === "time" ? ' class="row-slot"' : "";
      leftRows += `<tr${trCls}><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td></tr>`;
      rightRows += `<tr${trCls}>${cells}</tr>`;
    });
  });
  $("left-tbody").innerHTML = leftRows;
  $("tbody").innerHTML = rightRows;
  updateWeekLabel();
}

function bindCells(){
  document.querySelectorAll("td.cell").forEach(td => {
    td.addEventListener("input", () => {
      const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
      if (!schedule[currentRoom]) schedule[currentRoom] = {};
      if (!schedule[currentRoom][d]) schedule[currentRoom][d] = {};
      if (!schedule[currentRoom][d][s]) schedule[currentRoom][d][s] = {};
      schedule[currentRoom][d][s][r] = td.innerText.trim();
      td.classList.toggle("empty", !td.innerText.trim());
    });
  });
}

function shiftWeek(weeks){
  const base = parseDate(displayDates[0]) || new Date();
  displayDates = weekDates(mondayOf(addDays(base, weeks * 7)));
  selectedDate = "";
  renderTable(); bindCells();
  updateWeekLabel();
}

// ---------- 清除功能：选定日期列 / 全部 ----------
function clearSelectedDate(){
  if (!selectedDate) { setStatus("请先点击日期表头选中要清除的日期列", true); return; }
  const room = currentRoom;
  const n = Object.keys((schedule[room] && schedule[room][selectedDate]) || {}).length;
  const ok = confirm(`确认清除「${room}」${selectedDate} 的全部排班数据？（共 ${n} 个场次记录）\n\n点击确定后将写回 GitHub 并发布。`);
  if (!ok) return;
  if (schedule[room]) delete schedule[room][selectedDate];
  renderTable(); bindCells();
  setStatus(`已清除「${room}」${selectedDate} 的排班数据，正在保存并发布…`, false);
  save();
}
async function clearAll(){
  const room = currentRoom;
  const days = Object.keys(schedule[room] || {}).length;
  const ok = confirm(`确认清空「${room}」的全部排班数据？（共 ${days} 个日期）\n\n此操作不可撤销，点击确定后将写回 GitHub 并发布。`);
  if (!ok) return;
  delete schedule[room];
  schedule[room] = {};
  selectedDate = "";
  renderTable(); bindCells();
  setStatus(`已清空「${room}」全部排班数据，正在保存并发布…`, false);
  await save();
}

function buildStatsHtml(room){
  const data = schedule[room] || {};
  const counter = {};
  const today = todayISO();
  const day = data[today];
  if (day && typeof day === "object") {
    Object.keys(day).forEach(s => {
      const n = (day[s].anchor || "").trim();
      if (n) counter[n] = (counter[n] || 0) + 1;
    });
  }
  const arr = Object.keys(counter).map(n => `<span class="chip">主播 <b>${escapeHtml(n)}</b> × ${counter[n]} 场</span>`);
  if (arr.length) return arr.join("");
  return room === "问我我"
    ? '<a class="chip chip-edit" href="editor.html" target="_blank">在线编辑</a>'
    : '<span class="chip">今日暂无</span>';
}

function bjNow(){
  const n = new Date();
  return new Date(n.getTime() + (n.getTimezoneOffset() + 480) * 60000);
}
function clockMin(t){
  const m = String(t).match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1]) * 60 + (+m[2]) : -1;
}
/* 未来最近一场：当天无剩余场次自动取之后最近一天首场（与 render_web.py PAGE_JS nextRemind 一致） */
function nextRemindFor(room){
  const data = schedule[room] || {};
  const now = bjNow();
  let best = null;
  Object.keys(data).sort().forEach(d => {
    const day = data[d];
    if (!day || typeof day !== "object") return;
    SLOT_ORDER.forEach(slot => {
      const info = day[slot] || {};
      const mm = clockMin(info.time);
      if (mm < 0) return;
      const start = new Date(+d.slice(0,4), +d.slice(5,7) - 1, +d.slice(8,10), Math.floor(mm / 60), mm % 60);
      if (start <= now) return;
      if (!best || start < best.start) best = { start, slot, anchor: (info.anchor || "").trim() };
    });
  });
  return best;
}
function countdownText(start){
  const diffMin = Math.round((start - bjNow()) / 60000);
  if (diffMin < 1) return "即将开播";
  if (diffMin < 60) return diffMin + "分钟后";
  const h = diffMin / 60;
  if (h < 24) return (Math.round(h * 10) / 10) + "小时后";
  const d = Math.floor(h / 24);
  return d + "天后";
}
function buildRemindHtml(){
  const items = [];
  rooms.forEach(room => {
    const b = nextRemindFor(room);
    if (!b) {
      items.push(`<div class="hero-remind-item"><span class="hero-remind-room">${escapeHtml(room)}</span><div class="hero-remind-info"><span class="hero-remind-slot">暂无排班</span><span class="hero-remind-name off">暂无数据</span></div><span class="hero-remind-time">—</span></div>`);
      return;
    }
    const st = `${b.slot} ${String(b.start.getHours()).padStart(2,"0")}:${String(b.start.getMinutes()).padStart(2,"0")}`;
    const cd = countdownText(b.start);
    if (b.anchor) {
      items.push(`<div class="hero-remind-item"><span class="hero-remind-room">${escapeHtml(room)}</span><div class="hero-remind-info"><span class="hero-remind-slot">${st}</span><span class="hero-remind-name">${escapeHtml(b.anchor)}</span></div><span class="hero-remind-time">${cd}</span></div>`);
    } else {
      items.push(`<div class="hero-remind-item"><span class="hero-remind-room">${escapeHtml(room)}</span><div class="hero-remind-info"><span class="hero-remind-slot">${st}</span><span class="hero-remind-name off">无人播</span></div><span class="hero-remind-time">${cd}</span></div>`);
    }
  });
  if (!items.length) return '<div class="remind-empty">各直播间暂无排班数据，添加后自动生成提醒</div>';
  return `<div class="hero-remind-list">${items.join("")}</div>`;
}

function buildRoomTableHtml(room){
  const data = schedule[room] || {};
  const dateHeader = displayDates.map(d => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    return `<th class="date-col">${fmtDate(d)}<span class="wd">${wd}</span></th>`;
  }).join("");
  const leftRows = [];
  const rightRows = [];
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn]) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (data[d] && data[d][slot] && data[d][slot][rk] !== undefined) ? data[d][slot][rk] : "";
        if (val) {
          let cls = "cell";
          if (rk === "anchor") cls = "cell anchor";
          else if (rk === "car") cls = "cell car";
          else if (rk === "time") cls = "cell time";
          cells += `<td class="${cls}">${escapeHtml(val)}</td>`;
        } else {
          cells += '<td class="cell empty">·</td>';
        }
      });
      const rowLabel = rk === "time" ? `<span class="slot-badge">${slot}</span>` : "";
      const trCls = rk === "time" ? ' class="row-slot"' : "";
      leftRows.push(`<tr${trCls}><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td></tr>`);
      rightRows.push(`<tr${trCls}>${cells}</tr>`);
    });
  });
  return `<div class="room-table" data-room="${escapeHtml(room)}"><div class="schedule-wrap"><div class="left-panel"><table class="left-table"><thead><tr><th class="col-slot">场次</th><th class="col-role">角色</th></tr></thead><tbody>${leftRows.join("")}</tbody></table></div><div class="right-scroll"><table class="right-table"><thead><tr>${dateHeader}</tr></thead><tbody>${rightRows.join("")}</tbody></table></div></div></div>`;
}

function renderHtml(updatedAt){
  const roomTables = rooms.map(buildRoomTableHtml).join("");
  const tabs = rooms.map((r, i) =>
    `<button class="sheet-tab${i === 0 ? " active" : ""}" data-room="${escapeHtml(r)}">${escapeHtml(r)}</button>`
  ).join("");
  const statsAll = rooms.map((r, i) =>
    `<div class="stats" data-stats-for="${escapeHtml(r)}"${i === 0 ? "" : ' style="display:none"'} data-room-stats="${escapeHtml(r)}">${buildStatsHtml(r)}</div>`
  ).join("");
  const marqueeItems = MARQUEE_ITEMS.map(it => `<span>${it}</span>`).join("");
  const marquee = `<div class="marquee"><div class="marquee-track">${marqueeItems}${marqueeItems}</div></div>`;
  const remindList = buildRemindHtml();

  const pageJs = PAGE_JS_TEMPLATE
    .split("__SCHEDULE_JSON__").join(jsSafe(schedule))
    .split("__CFG_JSON__").join(jsSafe(cfg))
    .split("__CSS_TEMPLATE_JSON__").join(jsSafe(CSS_VIEW))
    .split("__PAGE_JS_JSON__").join(jsSafe(PAGE_JS_TEMPLATE));

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>

function getToken(){
  return (localStorage.getItem("gh_token") || "").trim();
}
function setStatus(msg, isErr){
  const el = $("save-status");
  el.textContent = msg;
  el.className = isErr ? "err" : "";
}
async function ghGetSha(path){
  const token = getToken();
  const r = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) {
    if (r.status === 404) return null;
    throw new Error(`获取 ${path} 失败: HTTP ${r.status}`);
  }
  const j = await r.json();
  return j.sha || null;
}
async function ghPut(path, content){
  const token = getToken();
  const sha = await ghGetSha(path);
  const body = { message: "在线编辑排班表", content: btoa(unescape(encodeURIComponent(content))) };
  if (sha) body.sha = sha;
  const r = await fetch(API + path, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); msg = (j.message || "") + (j.errors ? " " + JSON.stringify(j.errors) : ""); } catch(e){}
    throw new Error(`更新 ${path} 失败: ${msg}`);
  }
  return true;
}

async function save(){
  // 收集当前直播间表格输入
  document.querySelectorAll("td.cell").forEach(td => {
    const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
    if (!schedule[currentRoom]) schedule[currentRoom] = {};
    if (!schedule[currentRoom][d]) schedule[currentRoom][d] = {};
    if (!schedule[currentRoom][d][s]) schedule[currentRoom][d][s] = {};
    schedule[currentRoom][d][s][r] = td.innerText.trim();
  });

  // 清理空数据（所有直播间）
  rooms.forEach(room => {
    const cleanRoom = {};
    Object.keys(schedule[room] || {}).sort().forEach(d => {
      const slots = {};
      Object.keys(schedule[room][d] || {}).forEach(s => {
        const info = {};
        let has = false;
        ROLES.forEach(([rk]) => {
          const v = (schedule[room][d][s][rk] || "").trim();
          info[rk] = v;
          if (v) has = true;
        });
        if (has) slots[s] = info;
      });
      if (Object.keys(slots).length) cleanRoom[d] = slots;
    });
    schedule[room] = cleanRoom;
  });

  cfg.rooms = rooms.slice();
  cfg.display_dates = displayDates.slice();

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const updatedAt = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const html = renderHtml(updatedAt);

  if (!getToken()) {
    $("token-bar").style.display = "block";
    setStatus("请先输入 GitHub Token 后保存", true);
    $("token-input").focus();
    return;
  }

  setStatus("正在保存并发布…", false);
  const btn = $("btn-save");
  btn.disabled = true;
  try {
    await ghPut("schedule.json", JSON.stringify(schedule, null, 2) + "\n");
    await ghPut("config.json", JSON.stringify(cfg, null, 2) + "\n");
    await ghPut("index.html", html);
    await ghPut("output/schedule.html", html);
    setStatus("保存成功！GitHub Pages 约 1~2 分钟后自动更新，可点「返回首页」确认。", false);
  } catch (e) {
    setStatus(e.message, true);
    if (/Bad credentials|401/.test(e.message)) {
      $("token-bar").style.display = "block";
    }
  } finally {
    btn.disabled = false;
  }
}

// ---------- 清除日期范围（当前直播间） ----------
function parseDateInput(s){
  s = String(s || "").trim();
  let m;
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  m = s.match(/^(\d{1,2})月(\d{1,2})[日号]?$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
// 预览日期输入框：兼容 08/17、08-17、2026-08-17、8月17日、8.17、0817
function parseFlexDate(s){
  s = String(s == null ? "" : s).trim();
  if (!s) return null;
  let m, y, mo, d;
  m = s.match(/^(\d{4})[-/.]?(\d{1,2})[-/.]?(\d{1,2})$/);
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = s.match(/^(\d{1,2})[-/.]?(\d{1,2})$/);
    if (m) { y = new Date().getFullYear(); mo = +m[1]; d = +m[2]; }
    else {
      m = s.match(/^(\d{1,2})月(\d{1,2})[日号]?$/);
      if (m) { y = new Date().getFullYear(); mo = +m[1]; d = +m[2]; }
      else {
        m = s.match(/^(\d{2})(\d{2})$/);
        if (m && +m[1] >= 1 && +m[1] <= 12) { y = new Date().getFullYear(); mo = +m[1]; d = +m[2]; }
      }
    }
  }
  if (!m) return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() + 1 !== mo || dt.getDate() !== d) return null;
  return dt;
}
// ---------- 复制粘贴自动解析（多行表格，按列匹配当前周） ----------
const PASTE_STOPWORDS = new Set(["主播","直播","开播","时间","车型","场次","备注","开始","结束","上午","下午","晚上","早上","中午","房间","直播间","排班","星期","周"]);
const ROOM_MARKERS = ["问我我","猎装","9X","8X","7X"];
function extractTime(s){
  const t = String(s == null ? "" : s).replace(/；/g, ";").replace(/；/g, ";");
  // 容错：结束时间误用分号（14:00-16;00）
  let m = t.match(/(\d{1,2}):(\d{2})\s*[-~至到]\s*(\d{1,2})[;:](\d{2})/);
  if (m) return `${m[1]}:${m[2]}-${m[3]}:${m[4]}`;
  m = t.match(/(\d{1,2}):(\d{2})/);
  if (m) return `${m[1]}:${m[2]}`;
  return "";
}
function extractCar(s){
  const t = String(s == null ? "" : s).trim();
  const low = t.toLowerCase();
  const rm = ROOM_MARKERS.find(m => low.includes(m.toLowerCase()));
  if (rm) return rm;
  // 截图/OCR 车型常见形态：数字+字母组合（如 焕新007GT/001、001GT），整格作为车型
  if (/[a-z]/i.test(t) && /\d/.test(t) && t.length <= 24) return t;
  return "";
}
function dedupeRepeat(s){
  // 主播格重复人名挤格（如「霍晶晶霍晶晶霍晶晶」）还原为单个「霍晶晶」
  const str = String(s == null ? "" : s);
  for (let len = 2; len <= 4; len++) {
    const sub = str.slice(0, len);
    if (!sub) continue;
    if (str.length > sub.length && str.length % sub.length === 0 && str === sub.repeat(str.length / sub.length)) return sub;
  }
  return str;
}
function extractAllNames(s){
  // 主播格可能多人混写，用 | / 、 或空格分隔；返回全部去重有效名（多主播场景）
  const parts = String(s == null ? "" : s).split(/[|｜/、,，\s]+/).map(x => x.trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  for (const p of parts) {
    const cleaned = dedupeRepeat(p);
    const re = /([\u4e00-\u9fa5·]{2,4})/g;
    let m;
    while ((m = re.exec(cleaned)) !== null) {
      const w = m[1];
      if (PASTE_STOPWORDS.has(w)) continue;
      if (/\d/.test(w)) continue;
      if (seen.has(w)) continue;
      seen.add(w);
      out.push(w);
    }
  }
  return out;
}
function splitRowCells(line){
  if (line.includes("\t")) return line.split("\t").map(c => c.trim());
  // 单空格 / 多空格 / 逗号 / 顿号 均作为列分隔（表格复制常见）
  return line.split(/\s+/).map(c => c.trim()).filter(c => c !== "");
}
function slotByStart(timeStr){
  const m = String(timeStr || "").match(/(\d{1,2}):\d{2}/);
  if (!m) return "";
  const h = parseInt(m[1]);
  if (h <= 10) return SLOT_ORDER[0];   // 10:00 第1场
  if (h <= 12) return SLOT_ORDER[1];   // 12:00 第2场
  if (h <= 14) return SLOT_ORDER[2];   // 14:00/14:30 第3场
  if (h <= 17) return SLOT_ORDER[3];   // 16:00/17:00 第4场
  if (h <= 19) return SLOT_ORDER[4];   // 18:00/19:30 第5场
  return SLOT_ORDER[5];                 // 20:00 第6场
}
function parseTableText(text){
  // 以「时间行」作为组分隔锚点：时间行出现即开启新组，其后的非时间行按出现顺序
  // 依次作为 车型行 / 主播行1 / 主播行2 ... 归属该组。
  // 首个时间行之前的行被视为一组，共享第一个时间行的时间。
  // 首行若不含车型标记（7X/8X/9X/猎装等）且像人名，则降级为主播行（车型留空用默认）。
  // 注意：不能对整个行 trim——行首的 \t 代表「周一列空」的空列占位（Excel/表格复制常见），
  // 删掉会丢失列位置，导致只有中间列有值的行被整体左移（如周二/周三被解析成周一/周二）。
  // 因此只去掉行尾空白（\r 及尾部空格），保留行首制表符空位；纯空白行仍过滤。
  const lines = String(text || "").split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim() !== "");
  const columns = [];
  let ignoredCount = 0;
  const groups = [];
  let cur = null;
  let roleIdx = 0;
  let preRows = [];
  let firstTimeEncountered = false;
  const isCarLike = (line) => {
    // 行内任一单元格含车型标记即视为车型行
    return splitRowCells(line).some(c => extractCar(c) !== "");
  };
  const assignRows = (g, rows) => {
    // 首行：若像车型则作车型，否则作主播
    if (rows.length === 0) return;
    if (isCarLike(rows[0])) g.car = rows[0];
    else g.anchors.push(rows[0]);
    for (let i = 1; i < rows.length; i++) g.anchors.push(rows[i]);
  };
  lines.forEach(line => {
    if (extractTime(line)) {
      if (!firstTimeEncountered) {
        firstTimeEncountered = true;
        if (preRows.length > 0) {
          const g = { time: line, car: null, anchors: [] };
          assignRows(g, preRows);
          groups.push(g);
        }
      }
      cur = { time: line, car: null, anchors: [] };
      groups.push(cur);
      roleIdx = 0;
      return;
    }
    if (!firstTimeEncountered) {
      preRows.push(line);
      return;
    }
    if (roleIdx === 0) {
      if (isCarLike(line)) cur.car = line;
      else cur.anchors.push(line);
    } else {
      cur.anchors.push(line);
    }
    roleIdx++;
  });
  groups.forEach(g => {
    const timeCells = splitRowCells(g.time);
    const carCells = g.car ? splitRowCells(g.car) : [];
    const colCount = Math.max(timeCells.length, carCells.length);
    for (let i = 0; i < colCount; i++) {
      const time = extractTime(timeCells[i]);
      if (!time) continue;
      const date = i < displayDates.length ? displayDates[i] : null;
      if (!date) { ignoredCount++; continue; }
      const slot = slotByStart(time);
      let car = (i < carCells.length ? extractCar(carCells[i]) : "") || currentRoom;
      const allNames = [];
      const seen = new Set();
      g.anchors.forEach(ar => {
        extractAllNames(ar).forEach(nm => { if (!seen.has(nm)) { seen.add(nm); allNames.push(nm); } });
      });
      const anchor = allNames[0] || "";
      columns.push({ date, time, slot, car, anchor, anchorAll: allNames });
    }
  });
  if (!columns.length) return { ok: false, reason: "未识别到任何时间行（需包含如 14:00-16:00 的时间区间）" };
  return { ok: true, columns, ignoredCount };
}

      <textarea id="paste-text" placeholder="示例：&#10;20:00-22:00\t20:00-22:00\t19:00-22:00\t20:00-22:00\t20:00-22:00&#10;7X\t7X\t7X\t7X\t7X&#10;费紫阳\t费紫阳\t费紫阳\t费紫阳\t费紫阳"></textarea>
      <div class="paste-actions">
        <button class="btn-primary2" id="paste-parse-btn">解析预览</button>
        <button class="btn-outline" id="paste-cancel-btn">取消</button>
      </div>
      <div class="paste-preview" id="paste-preview"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#paste-cancel-btn").addEventListener("click", () => overlay.remove());
  overlay.querySelector("#paste-parse-btn").addEventListener("click", () => {

      return;
    }
    renderEditablePreview(box, result);
  });
}
function renderEditablePreview(box, result){
  const ignored = result.ignoredCount;
  let html = `<div style="font-size:12px;color:#0f1e3d;margin-bottom:8px;">共解析到 ${result.columns.length + ignored} 列：写入 ${result.columns.length} 列${ignored ? `，忽略不在表中的 ${ignored} 列` : ""}；直播间默认「${escapeHtml(currentRoom)}」。下方时间 / 车型 / 主播可直接编辑修正后确认。</div>`;
  html += `<table><thead><tr><th>日期</th><th>时间</th><th>场次</th><th>车型</th><th>主播</th></tr></thead><tbody>`;
  result.columns.forEach((c, ci) => {
    html += `<tr><td class="editable"><input class="cell-edit date-cell" data-ci="${ci}" data-field="date" value="${escapeHtml(fmtDate(c.date))}"></td>`;
    html += `<td class="editable"><input class="cell-edit" data-ci="${ci}" data-field="time" value="${escapeHtml(c.time)}"></td>`;
    html += `<td class="tm-cell">${escapeHtml(c.slot)}</td>`;
    html += `<td class="editable"><input class="cell-edit" data-ci="${ci}" data-field="car" value="${escapeHtml(c.car)}"></td>`;
    html += `<td class="editable${c.anchor ? "" : " missing"}"><input class="cell-edit" data-ci="${ci}" data-field="anchor" value="${escapeHtml(c.anchor || "")}"${c.anchor ? "" : ` placeholder="未识别，请填写"`}></td></tr>`;
  });
  html += `</tbody></table>`;
  html += `<div class="paste-actions"><button class="btn-primary2" id="paste-confirm-btn">确认写入并保存</button></div>`;
  box.innerHTML = html;
  box.querySelectorAll("input.cell-edit[data-ci]").forEach(inp => {
    inp.addEventListener("input", () => {
      const col = result.columns[+inp.dataset.ci];
      if (!col) return;
      if (inp.dataset.field === "date") {
        const dt = parseFlexDate(inp.value);
        inp.classList.toggle("invalid", !!inp.value.trim() && !dt);
        col.date = dt ? toISO(dt) : inp.value.trim();
      } else {
        col[inp.dataset.field] = inp.value.trim();
      }
    });
  });
  box.querySelector("#paste-confirm-btn").addEventListener("click", () => {
    const ov = box.closest(".paste-overlay");
    if (ov) ov.remove();
    confirmPaste(result);
  });
}
async function confirmPaste(result){
  if (!result || !result.columns || !result.columns.length) { setStatus("没有可写入的数据，已取消", true); return; }
  // 校验全部日期有效
  const bad = result.columns.filter(c => !parseFlexDate(c.date));
  if (bad.length) {
    setStatus(`有 ${bad.length} 行日期无效（如「${bad[0].date}」），已取消写入。请修改为 08/17、2026-08-17 等格式。`, true);
    return;
  }
  if (!schedule[currentRoom]) schedule[currentRoom] = {};
  // 已有同名场次：弹确认覆盖
  const conflicts = result.columns.filter(col => {
    const ex = schedule[currentRoom][col.date] && schedule[currentRoom][col.date][col.slot];
    return ex && (ex.time || ex.car || ex.anchor);
  });
  if (conflicts.length) {
    const lines = conflicts.slice(0, 5).map(c => `${c.date} ${c.slot}（${c.car || "-"} / ${c.anchor || "-"}）`).join("\n");
    const ok = confirm(`以下 ${conflicts.length} 个场次已有排班数据，确认覆盖？\n${lines}${conflicts.length > 5 ? `\n…等 ${conflicts.length} 条` : ""}`);
    if (!ok) { setStatus("已取消写入", false); return; }
  }
  result.columns.forEach(col => {
    if (!schedule[currentRoom][col.date]) schedule[currentRoom][col.date] = {};
    schedule[currentRoom][col.date][col.slot] = {
      time: col.time,
      car: col.car,
      anchor: col.anchor
    };
  });
  renderTable(); bindCells();
  const missing = result.columns.filter(c => !c.anchor).length;
  const msg = `已写入 ${result.columns.length} 列${result.ignoredCount ? `（${result.ignoredCount} 列不在表中已忽略）` : ""}${missing ? "（部分主播未识别，可手动补充）" : ""}，正在保存并发布…`;
  setStatus(msg, missing > 0 || result.ignoredCount > 0);
  await save();
}

// ---------- 粘贴截图 OCR 识别 ----------
const OCR_CDN_CANDIDATES = [
  {
    base: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1",
    core: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core-simd.wasm.js"
  },
  {
    base: "https://registry.npmmirror.com/tesseract.js/5.1.1/files",
    core: "https://registry.npmmirror.com/tesseract.js-core/5.1.1/files/tesseract-core-simd.wasm.js"
  }
];
let ocrCdn = null;
let ocrOverlay = null;

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("加载失败: " + src));
    document.head.appendChild(s);
  });
}
async function ensureTesseract(){
  if (window.Tesseract) return;
  for (const c of OCR_CDN_CANDIDATES) {
    try {
      await loadScript(c.base + "/dist/tesseract.min.js");
      ocrCdn = c;
      return;
    } catch (e) { /* 尝试下一个源 */ }
  }
  throw new Error("OCR 引擎加载失败，请检查网络后重试");
}
async function ocrImage(file, onProgress){
  await ensureTesseract();
  const worker = await Tesseract.createWorker("chi_sim", 1, {
    workerPath: ocrCdn.base + "/dist/worker.min.js",
    corePath: ocrCdn.core,
    langPath: "./tessdata",
    logger: m => { if (m.status === "recognizing text" && onProgress) onProgress(m.progress); }
  });
  try {
    const { data } = await worker.recognize(file);
    return data.text;
  } finally {
    await worker.terminate();
  }
}
function openOcrModal(){
  if (ocrOverlay && document.body.contains(ocrOverlay)) { ocrOverlay.remove(); }
  const overlay = document.createElement("div");
  overlay.className = "paste-overlay";
  overlay.id = "ocr-overlay";
  overlay.innerHTML = `
    <div class="paste-box" style="width:min(820px,94vw)">
      <h3>粘贴截图识别排班</h3>
      <p class="paste-desc">截图排班表（5 列：周一至周五；每 5 行一场：时间 / 车型 / 主播），在本页面按 Ctrl+V / Cmd+V 直接粘贴图片即可自动识别；识别结果可编辑修正后确认写入。首次使用需加载识别引擎（约 20MB），之后有缓存会快很多。</p>
      <div class="ocr-dropzone" id="ocr-dropzone">请截图后按 Ctrl+V / Cmd+V 粘贴图片，或点击此处选择图片文件</div>
      <input type="file" id="ocr-file-input" accept="image/*" style="display:none">
      <div class="ocr-progress" id="ocr-progress" style="display:none">
        <div class="track"><div class="bar" id="ocr-progress-bar"></div></div>
        <span id="ocr-progress-text">准备中…</span>
      </div>
      <div class="paste-preview" id="ocr-preview"></div>
      <div class="paste-actions">
        <button class="btn-outline" id="ocr-cancel-btn">取消</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  ocrOverlay = overlay;
  const dropzone = overlay.querySelector("#ocr-dropzone");
  const fileInput = overlay.querySelector("#ocr-file-input");
  dropzone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files[0]) runOcrOnImage(fileInput.files[0], overlay);
    fileInput.value = "";
  });
  overlay.querySelector("#ocr-cancel-btn").addEventListener("click", () => overlay.remove());
  overlay.querySelector(".paste-box").addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("drag"); });
  overlay.querySelector(".paste-box").addEventListener("dragleave", () => dropzone.classList.remove("drag"));
  overlay.querySelector(".paste-box").addEventListener("drop", e => {
    e.preventDefault(); dropzone.classList.remove("drag");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type && f.type.startsWith("image/")) runOcrOnImage(f, overlay);
  });
}
async function runOcrOnImage(file, overlay){
  const dropzone = overlay.querySelector("#ocr-dropzone");
  const progress = overlay.querySelector("#ocr-progress");
  const bar = overlay.querySelector("#ocr-progress-bar");
  const ptext = overlay.querySelector("#ocr-progress-text");
  const preview = overlay.querySelector("#ocr-preview");
  dropzone.style.display = "none";
  preview.innerHTML = "";
  progress.style.display = "flex";
  bar.style.width = "0%";
  ptext.textContent = "正在加载识别引擎…";
  try {
    const ocrText = await ocrImage(file, p => {
      ptext.textContent = "正在识别… " + Math.round(p * 100) + "%";
      bar.style.width = Math.round(p * 100) + "%";
    });
    progress.style.display = "none";
    const result = parseTableText(ocrText);
    if (!result.ok) {
      preview.innerHTML = `<div class="no-date">${escapeHtml(result.reason)}。请确认截图清晰、包含整张表格，或改用手动粘贴。</div>`;
      dropzone.style.display = "block";
      return;
    }
    renderEditablePreview(preview, result);
  } catch (err) {
    progress.style.display = "none";
    dropzone.style.display = "block";
    preview.innerHTML = `<div class="no-date">OCR 识别失败：${escapeHtml(err.message || "未知错误")}。请检查网络后重试，或改用手动粘贴。</div>`;
  }
}
document.addEventListener("paste", e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let imgItem = null;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) { imgItem = it; break; }
  }
  if (!imgItem) return;
  e.preventDefault();
  const file = imgItem.getAsFile();
  if (!file) return;
  if (ocrOverlay && document.body.contains(ocrOverlay)) {
    runOcrOnImage(file, ocrOverlay);
  } else {
    openOcrModal();
    runOcrOnImage(file, ocrOverlay);
  }
});

function init(){
  $("btn-prev-week").addEventListener("click", () => shiftWeek(-1));
  $("btn-next-week").addEventListener("click", () => shiftWeek(1));
  $("btn-save").addEventListener("click", save);
  $("btn-clear-all").addEventListener("click", clearAll);
  $("btn-paste-parse").addEventListener("click", openPasteModal);
  $("btn-token-save").addEventListener("click", () => {
    const t = $("token-input").value.trim();
    if (!t) { setStatus("Token 不能为空", true); return; }
    localStorage.setItem("gh_token", t);
    $("token-bar").style.display = "none";
    $("token-input").value = "";
    setStatus("Token 已保存（仅本浏览器有效）", false);
  });
  $("btn-token-clear").addEventListener("click", () => {
    localStorage.removeItem("gh_token");
    $("token-input").value = "";
    setStatus("Token 已清除", false);
  });
  document.addEventListener("click", e => {
    const th = e.target.closest("th.date-col");
    if (th) {
      const d = th.dataset.date;
      selectedDate = (selectedDate === d) ? "" : d;
      renderTable(); bindCells();
      return;
    }
    const del = e.target.closest(".room-tab-del");
    if (del) { e.stopPropagation(); deleteRoomEditor(del.dataset.delRoom); return; }
    const tab = e.target.closest(".room-tab-editor");
    if (tab) { switchRoom(tab.dataset.room); return; }
    const add = e.target.closest("#btn-room-add");
    if (add) { addRoomEditor(); return; }
  });
  updateWeekLabel();
}

(async function main(){
  await loadData();
  renderRoomSwitch();
  renderTable();
  bindCells();
  init();
  if (getToken()) { $("token-bar").style.display = "none"; }
})();
</script>
