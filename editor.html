<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班表 · 在线编辑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.145 0.012 255);
  --surface: oklch(0.185 0.015 255);
  --surface-2: oklch(0.215 0.016 255);
  --line: oklch(0.32 0.02 255 / 0.4);
  --line-strong: oklch(0.40 0.02 255 / 0.5);
  --text: oklch(0.93 0.008 255);
  --text-dim: oklch(0.70 0.015 255);
  --text-faint: oklch(0.50 0.015 255);
  --accent: oklch(0.82 0.13 78);
  --accent-soft: oklch(0.82 0.13 78 / 0.13);
  --font: "Space Grotesk", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{
  font-family:var(--font);
  background:
    radial-gradient(1100px 560px at 88% -12%, oklch(0.24 0.045 255 / 0.5), transparent 62%),
    radial-gradient(900px 520px at -8% 112%, oklch(0.20 0.035 78 / 0.22), transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:1720px;margin:0 auto;padding:0 28px 56px}
.masthead{padding:48px 0 24px}
.eyebrow{font-size:12px;letter-spacing:.30em;color:var(--accent);text-transform:uppercase;font-weight:600;margin-bottom:12px}
.masthead h1{font-size:clamp(26px,3.6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.sub{margin-top:10px;color:var(--text-dim);font-size:14px}
.sub .dot{color:var(--accent);margin:0 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 4px}
.toolbar button,.toolbar a.btn-view{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s,transform .2s,background .2s;font-family:var(--font)}
.toolbar button:hover,.toolbar a.btn-view:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.toolbar .btn-primary{background:var(--accent);color:oklch(0.15 0.02 255);border-color:transparent;font-weight:600}
.toolbar .btn-primary:hover{box-shadow:0 8px 24px var(--accent-soft);color:oklch(0.15 0.02 255)}
.toolbar .btn-danger{background:transparent;color:#e17055;border-color:oklch(0.6 0.12 25 / 0.5)}
.toolbar .btn-danger:hover{border-color:#e17055;color:#e17055}
#save-status{font-size:13px;color:var(--accent);min-height:18px;margin:8px 0 0}
#save-status.err{color:#e17055}
.token-bar{background:oklch(0.22 0.03 85 / 0.35);border:1px solid oklch(0.60 0.10 80 / 0.4);border-radius:12px;padding:14px 18px;margin:12px 0 0;max-width:880px;text-align:left;font-size:13px;color:var(--text-dim);display:none}
.token-bar b{color:var(--text)}
.token-bar input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:var(--font)}
.token-bar input:focus{border-color:var(--accent)}
.token-bar .token-actions{display:flex;gap:8px;margin-top:8px}
.token-bar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--font)}
.token-bar button.btn-primary{background:var(--accent);color:oklch(0.15 0.02 255);border-color:transparent;font-weight:600}
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 24px 70px oklch(0 0 0 / 0.35);margin-top:14px;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.board-scroll{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:1500px;font-size:13px}
thead th{background:var(--surface-2);color:var(--text-dim);font-weight:600;padding:13px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.date-col{min-width:104px;color:var(--text);font-weight:500}
.date-col .wd{display:block;font-size:11px;color:var(--text-faint);font-weight:400;margin-top:3px}
.date-col .del-date{display:inline-block;margin-top:5px;font-size:11px;font-weight:400;cursor:pointer;color:var(--text-faint);text-decoration:underline;opacity:.8;transition:color .15s}
.date-col .del-date:hover{color:#e17055}
td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;color:var(--text);vertical-align:middle;transition:background .15s}
.row-slot td{border-top:1px solid var(--line-strong)}
.slot-col{width:72px;color:var(--text-faint);font-weight:500}
.slot-badge{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:4px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}
.role-col{width:86px;color:var(--text-dim);font-size:12px;font-weight:500}
td.cell{min-width:92px;min-height:28px;outline:none;cursor:text}
td.cell:hover{background:oklch(0.27 0.025 255 / 0.6)}
td.cell:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
td.cell.anchor{color:var(--accent);font-weight:600}
td.cell.empty{color:var(--text-faint)}
.board-note{margin-top:14px;font-size:12px;color:var(--text-faint);padding:0 6px 6px}
.foot{text-align:center;color:var(--text-faint);font-size:12px;letter-spacing:.10em;padding:32px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.shell{padding:0 16px 40px}.masthead{padding:36px 0 18px}.masthead h1{font-size:26px}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="eyebrow">ZEEKR 7X · Live Ops</div>
    <h1>直播排班表 · 在线编辑</h1>
    <p class="sub">点击单元格直接编辑<span class="dot">·</span>保存后自动更新公开网页（GitHub Pages 约 1~2 分钟后生效）</p>
    <div class="toolbar">
      <button class="btn-primary" id="btn-add-date">＋ 新增日期列</button>
      <button id="btn-prev-week">上周</button>
      <button id="btn-next-week">下周</button>
      <button class="btn-primary" id="btn-save">保存并发布</button>
      <a class="btn-view" href="index.html" target="_blank">查看网页</a>
    </div>
    <div id="save-status"></div>
  </header>

  <div class="token-bar" id="token-bar">
    <div><b>首次保存需要 GitHub Token</b>（Fine-grained PAT，仅授权本仓库 Contents 读写权限）。Token 仅保存在当前浏览器的本地存储中，不会写入公开页面。换浏览器/设备需重新输入。</div>
    <input type="password" id="token-input" placeholder="粘贴 GitHub Token（ghp_ 或 github_pat_ 开头）">
    <div class="token-actions">
      <button class="btn-primary" id="btn-token-save">保存 Token</button>
      <button id="btn-token-clear">清除 Token</button>
    </div>
  </div>

  <div class="board">
    <div class="board-scroll">
      <table id="edit-table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="board-note">琥珀色为主播 · 点击「删除本列」可移除日期列</div>
  </div>

  <footer class="foot">7X LIVE OPS CONSOLE · Marvis Schedule Reminder</footer>
</div>

<script>
"use strict";
const REPO_OWNER = "Kayn-QY";
const REPO_NAME = "-";
const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
const WEEKDAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const ROLES = [
  ["time", "直播时间"],
  ["car", "直播车型"],
  ["anchor", "主播"],
  ["tech", "技术"],
  ["ad", "投流"],
];
const SLOT_ORDER = ["第1场","第2场","第3场","第4场","第5场","第6场"];

let schedule = {};
let displayDates = [];
let cfg = {};

function $(id){ return document.getElementById(id); }
function fmtDate(d){ return d.slice(5).replace("-", "/"); }
function parseDate(s){
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

async function loadData(){
  try {
    const [sRes, cRes] = await Promise.all([
      fetch("schedule.json", {cache: "no-store"}),
      fetch("config.json", {cache: "no-store"}),
    ]);
    if (!sRes.ok) throw new Error("schedule.json 加载失败: " + sRes.status);
    schedule = await sRes.json();
    if (cRes.ok) cfg = await cRes.json();
    displayDates = (cfg.display_dates && cfg.display_dates.length) ? cfg.display_dates : Object.keys(schedule).sort();
    Object.keys(schedule).forEach(d => { if (!displayDates.includes(d)) displayDates.push(d); });
    displayDates.sort();
  } catch (e) {
    schedule = {};
    displayDates = [];
    setStatus("数据加载失败（请确认是通过 https://kayn-qy.github.io/-/editor.html 访问）: " + e.message, true);
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderTable(){
  let headHtml = '<th class="col-slot">场次</th><th class="col-role">角色</th>';
  displayDates.forEach((d, i) => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    headHtml += `<th class="date-col">${fmtDate(d)}<span class="wd">${wd}</span><span class="del-date" data-del-date="${i}">删除本列</span></th>`;
  });
  $("thead-row").innerHTML = headHtml;

  let rows = "";
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn], ri) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (schedule[d] && schedule[d][slot] && schedule[d][slot][rk] !== undefined) ? schedule[d][slot][rk] : "";
        const cls = rk === "anchor" ? "cell anchor" : "cell" + (val ? "" : " empty");
        cells += `<td class="${cls}" contenteditable="true" data-date="${d}" data-slot="${slot}" data-role="${rk}">${escapeHtml(val)}</td>`;
      });
      const rowLabel = rk === "time" ? `<span class="slot-badge">${slot}</span>` : "";
      const trCls = rk === "time" ? ' class="row-slot"' : "";
      rows += `<tr${trCls}><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td>${cells}</tr>`;
    });
  });
  $("tbody").innerHTML = rows;
}

function bindCells(){
  document.querySelectorAll("td.cell").forEach(td => {
    td.addEventListener("input", () => {
      const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
      if (!schedule[d]) schedule[d] = {};
      if (!schedule[d][s]) schedule[d][s] = {};
      schedule[d][s][r] = td.innerText.trim();
      td.classList.toggle("empty", !td.innerText.trim());
    });
  });
}

function addDateColumn(){
  const input = prompt("输入新日期（格式 2026-08-20，或 08-20）：");
  if (!input) return;
  const dt = parseDate(input.trim());
  if (!dt) { setStatus("日期格式不正确", true); return; }
  const iso = toISO(dt);
  if (displayDates.includes(iso)) { setStatus("该日期已存在", true); return; }
  displayDates.push(iso);
  displayDates.sort();
  if (!schedule[iso]) schedule[iso] = {};
  renderTable(); bindCells();
  setStatus(`已添加日期列 ${iso}`, false);
}
function delDateColumn(i){
  const d = displayDates[i];
  if (!confirm(`确定删除日期列 ${d} 及其全部排班数据？`)) return;
  displayDates.splice(i, 1);
  delete schedule[d];
  renderTable(); bindCells();
  setStatus(`已删除 ${d}`, false);
}
function shiftWeek(days){
  displayDates = displayDates.map(d => { const dt = parseDate(d); return dt ? toISO(addDays(dt, days)) : d; });
  displayDates.sort();
  renderTable(); bindCells();
}

// ---------- 渲染 HTML（与 render_web.py 视觉一致） ----------
const CSS_VIEW = `
:root{
  --bg: oklch(0.145 0.012 255);
  --surface: oklch(0.185 0.015 255);
  --surface-2: oklch(0.215 0.016 255);
  --line: oklch(0.32 0.02 255 / 0.4);
  --line-strong: oklch(0.40 0.02 255 / 0.5);
  --text: oklch(0.93 0.008 255);
  --text-dim: oklch(0.70 0.015 255);
  --text-faint: oklch(0.50 0.015 255);
  --accent: oklch(0.82 0.13 78);
  --accent-soft: oklch(0.82 0.13 78 / 0.13);
  --font: "Space Grotesk", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{font-family:var(--font);background:radial-gradient(1100px 560px at 88% -12%, oklch(0.24 0.045 255 / 0.5), transparent 62%),radial-gradient(900px 520px at -8% 112%, oklch(0.20 0.035 78 / 0.22), transparent 60%),var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.shell{max-width:1680px;margin:0 auto;padding:0 28px 64px}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;padding:56px 0 30px}
.eyebrow{font-size:12px;letter-spacing:.30em;color:var(--accent);text-transform:uppercase;font-weight:600;margin-bottom:12px}
.masthead h1{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.04}
.sub{margin-top:12px;color:var(--text-dim);font-size:14px}
.sub .dot{color:var(--accent);margin:0 8px}
.sub time{color:var(--text);font-weight:500}
.btn-edit{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:oklch(0.15 0.02 255);text-decoration:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s;white-space:nowrap}
.btn-edit:hover{transform:translateY(-2px);box-shadow:0 10px 28px var(--accent-soft)}
.btn-edit:active{transform:translateY(0)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{font-size:13px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;transition:border-color .2s,color .2s,transform .2s}
.chip b{color:var(--accent);font-weight:600}
.chip:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 24px 70px oklch(0 0 0 / 0.35);animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.board-scroll{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:1260px;font-size:13px}
thead th{background:var(--surface-2);color:var(--text-dim);font-weight:600;padding:13px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.date-col{min-width:98px;color:var(--text);font-weight:500}
.date-col .wd{display:block;font-size:11px;color:var(--text-faint);font-weight:400;margin-top:3px}
td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:center;color:var(--text);vertical-align:middle;transition:background .15s}
tbody tr:hover td{background:oklch(0.26 0.02 255 / 0.55)}
.row-slot td{border-top:1px solid var(--line-strong)}
.slot-col{width:72px;color:var(--text-faint);font-weight:500}
.slot-badge{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:4px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.02em}
.role-col{width:86px;color:var(--text-dim);font-size:12px;font-weight:500}
.cell{min-height:26px}
.cell.anchor{color:var(--accent);font-weight:600}
.cell.empty{color:var(--text-faint)}
.cell .void{opacity:.35}
.board-note{margin-top:14px;font-size:12px;color:var(--text-faint);padding:0 6px 6px}
.foot{text-align:center;color:var(--text-faint);font-size:12px;letter-spacing:.10em;padding:36px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.shell{padding:0 16px 48px}.masthead{padding:40px 0 22px}.masthead h1{font-size:28px}}
`;

function renderHtml(updatedAt){
  const counter = {};
  Object.values(schedule).forEach(slots => Object.values(slots).forEach(info => {
    const n = (info.anchor || "").trim();
    if (n) counter[n] = (counter[n] || 0) + 1;
  }));
  const chips = Object.entries(counter).map(([n, c]) => `<span class="chip">主播 <b>${escapeHtml(n)}</b> × ${c} 场</span>`).join("") || '<span class="chip">暂无数据</span>';

  const dateHeader = displayDates.map(d => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    return `<th class="date-col">${fmtDate(d)}<span class="wd">${wd}</span></th>`;
  }).join("");

  const rows = [];
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn]) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (schedule[d] && schedule[d][slot] && schedule[d][slot][rk] !== undefined) ? schedule[d][slot][rk] : "";
        if (val) {
          const cls = rk === "anchor" ? "cell anchor" : "cell";
          cells += `<td class="${cls}">${escapeHtml(val)}</td>`;
        } else {
          cells += '<td class="cell empty"><span class="void">·</span></td>';
        }
      });
      const rowLabel = rk === "time" ? `<span class="slot-badge">${slot}</span>` : "";
      const trCls = rk === "time" ? ' class="row-slot"' : "";
      rows.push(`<tr${trCls}><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td>${cells}</tr>`);
    });
  });

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【7X官方直播间】直播排班表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${CSS_VIEW}</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <div class="eyebrow">ZEEKR 7X · Live Ops</div>
      <h1>直播排班表</h1>
      <p class="sub">【7X官方直播间】<span class="dot">·</span>数据更新 <time>${updatedAt}</time></p>
    </div>
    <a class="btn-edit" href="editor.html" target="_blank">在线编辑</a>
  </header>

  <section class="stats">${chips}</section>

  <section class="board">
    <div class="board-scroll">
      <table>
        <thead>
          <tr><th class="col-slot">场次</th><th class="col-role">角色</th>${dateHeader}</tr>
        </thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
    <div class="board-note">琥珀色为主播 · 空白点为未排班（周末/节假日/未填写）</div>
  </section>

  <footer class="foot">7X LIVE OPS CONSOLE · Marvis Schedule Reminder</footer>
</div>
</body>
</html>`;
}

function getToken(){
  return (localStorage.getItem("gh_token") || "").trim();
}
function setStatus(msg, isErr){
  const el = $("save-status");
  el.textContent = msg;
  el.className = isErr ? "err" : "";
}
async function ghGetSha(path){
  const token = getToken();
  const r = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) {
    if (r.status === 404) return null;
    throw new Error(`获取 ${path} 失败: HTTP ${r.status}`);
  }
  const j = await r.json();
  return j.sha || null;
}
async function ghPut(path, content){
  const token = getToken();
  const sha = await ghGetSha(path);
  const body = { message: "在线编辑排班表", content: btoa(unescape(encodeURIComponent(content))) };
  if (sha) body.sha = sha;
  const r = await fetch(API + path, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); msg = (j.message || "") + (j.errors ? " " + JSON.stringify(j.errors) : ""); } catch(e){}
    throw new Error(`更新 ${path} 失败: ${msg}`);
  }
  return true;
}

async function save(){
  document.querySelectorAll("td.cell").forEach(td => {
    const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
    if (!schedule[d]) schedule[d] = {};
    if (!schedule[d][s]) schedule[d][s] = {};
    schedule[d][s][r] = td.innerText.trim();
  });
  const clean = {};
  Object.keys(schedule).sort().forEach(d => {
    const slots = {};
    Object.keys(schedule[d]).forEach(s => {
      const info = {};
      let has = false;
      ROLES.forEach(([rk]) => {
        const v = (schedule[d][s][rk] || "").trim();
        info[rk] = v;
        if (v) has = true;
      });
      if (has) slots[s] = info;
    });
    if (Object.keys(slots).length) clean[d] = slots;
  });
  schedule = clean;

  cfg.display_dates = displayDates.slice();

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const updatedAt = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const html = renderHtml(updatedAt);

  if (!getToken()) {
    $("token-bar").style.display = "block";
    setStatus("请先输入 GitHub Token 后保存", true);
    $("token-input").focus();
    return;
  }

  setStatus("正在保存并发布…", false);
  const btn = $("btn-save");
  btn.disabled = true;
  try {
    await ghPut("schedule.json", JSON.stringify(schedule, null, 2) + "\n");
    await ghPut("config.json", JSON.stringify(cfg, null, 2) + "\n");
    await ghPut("index.html", html);
    await ghPut("output/schedule.html", html);
    setStatus("保存成功！GitHub Pages 约 1~2 分钟后自动更新，可点「查看网页」确认。", false);
  } catch (e) {
    setStatus(e.message, true);
    if (/Bad credentials|401/.test(e.message)) {
      $("token-bar").style.display = "block";
    }
  } finally {
    btn.disabled = false;
  }
}

function init(){
  $("btn-add-date").addEventListener("click", addDateColumn);
  $("btn-prev-week").addEventListener("click", () => shiftWeek(-7));
  $("btn-next-week").addEventListener("click", () => shiftWeek(7));
  $("btn-save").addEventListener("click", save);
  $("btn-token-save").addEventListener("click", () => {
    const t = $("token-input").value.trim();
    if (!t) { setStatus("Token 不能为空", true); return; }
    localStorage.setItem("gh_token", t);
    $("token-bar").style.display = "none";
    $("token-input").value = "";
    setStatus("Token 已保存（仅本浏览器有效）", false);
  });
  $("btn-token-clear").addEventListener("click", () => {
    localStorage.removeItem("gh_token");
    $("token-input").value = "";
    setStatus("Token 已清除", false);
  });
  document.addEventListener("click", e => {
    const del = e.target.closest(".del-date");
    if (del) delDateColumn(parseInt(del.dataset.delDate, 10));
  });
}

(async function main(){
  await loadData();
  renderTable();
  bindCells();
  init();
  if (getToken()) { $("token-bar").style.display = "none"; }
})();
</script>
</body>
</html>
