<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班表 · 在线编辑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2d3436; }
  .container { max-width: 1700px; margin: 0 auto; padding: 24px 16px; }
  header { text-align: center; padding: 20px 0 16px; }
  header h1 { font-size: 24px; color: #1a1a2e; }
  header p { color: #7f8c8d; margin-top: 6px; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 16px 0 4px; }
  .toolbar button { border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-primary { background: #0984e3; color: #fff; }
  .btn-primary:hover { background: #0873c4; }
  .btn-danger { background: #d63031; color: #fff; }
  .btn-danger:hover { background: #b52b2b; }
  .btn-plain { background: #fff; color: #555; border: 1px solid #d5dbe4 !important; }
  .btn-plain:hover { background: #f0f4fb; }
  #save-status { font-size: 13px; color: #0984e3; min-height: 18px; margin: 6px 0 0; }
  #save-status.err { color: #d63031; }
  .token-bar { background: #fff8e6; border: 1px solid #f0d48a; border-radius: 10px; padding: 12px 16px; margin: 10px auto 0; max-width: 860px; text-align: left; font-size: 13px; color: #6b5b2e; display: none; }
  .token-bar input { width: 100%; padding: 8px 10px; border: 1px solid #d5dbe4; border-radius: 6px; margin-top: 6px; font-size: 13px; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 16px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 1400px; }
  th, td { border: 1px solid #e8ecf1; padding: 6px 8px; text-align: center; font-size: 13px; }
  th { background: #0984e3; color: #fff; font-weight: 600; white-space: nowrap; }
  .date-col { min-width: 96px; }
  .date-col .del-date { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; cursor: pointer; color: #ffeaa7; text-decoration: underline; opacity: .9; }
  .weekday { font-size: 11px; font-weight: 400; opacity: .85; }
  .slot-col { background: #f0f4fb; font-weight: 600; color: #0984e3; width: 56px; }
  .role-col { background: #fafbfc; font-weight: 600; width: 70px; font-size: 12px; color: #555; }
  .cell { min-width: 88px; min-height: 26px; outline: none; }
  .cell:focus { background: #eef6ff; box-shadow: inset 0 0 0 2px #0984e3; }
  .cell.role-anchor { font-weight: 600; color: #d63031; }
  .cell.empty { background: #fcfcfd; }
  .legend { margin-top: 12px; font-size: 12px; color: #7f8c8d; }
  footer { text-align: center; color: #b2bec3; font-size: 12px; padding: 16px 0 32px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>直播排班表 · 在线编辑</h1>
    <p>点击单元格直接编辑 · 保存后自动更新公开网页（GitHub Pages 约 1~2 分钟后生效）</p>
    <div class="toolbar">
      <button class="btn-primary" id="btn-add-date">＋ 新增日期列</button>
      <button class="btn-plain" id="btn-prev-week">上周</button>
      <button class="btn-plain" id="btn-next-week">下周</button>
      <button class="btn-primary" id="btn-save">保存并发布</button>
      <a class="btn-plain" id="btn-view" href="index.html" target="_blank" style="text-decoration:none;border:1px solid #d5dbe4;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;color:#555;background:#fff;">查看网页</a>
    </div>
    <div id="save-status"></div>
  </header>
  <div class="token-bar" id="token-bar">
    <div><b>首次保存需要 GitHub Token（Fine-grained PAT，仅授权本仓库 Contents 读写权限）</b>。Token 仅保存在你当前浏览器的本地存储中，不会写入公开页面。之后保存无需再输入；换浏览器/设备需重新输入。</div>
    <input type="password" id="token-input" placeholder="粘贴 GitHub Token（ghp_ 或 github_pat_ 开头）">
    <div style="margin-top:6px;display:flex;gap:8px;">
      <button class="btn-primary" id="btn-token-save">保存 Token</button>
      <button class="btn-plain" id="btn-token-clear">清除 Token</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="edit-table">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="legend">红色为主播 · 空白为未排班 · 点击「删除」可移除日期列</div>
  </div>
  <footer>Generated by Marvis Schedule Reminder · 在线编辑器</footer>
</div>

<script>
"use strict";
const REPO_OWNER = "Kayn-QY";
const REPO_NAME = "-";
const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
const WEEKDAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const ROLES = [
  ["time", "直播时间"],
  ["car", "直播车型"],
  ["anchor", "主播"],
  ["tech", "技术"],
  ["ad", "投流"],
];
const SLOT_ORDER = ["第1场","第2场","第3场","第4场","第5场","第6场"];

let schedule = {};          // { date: { slot: {role: value} } }
let displayDates = [];      // 展示的日期列
let cfg = {};

function $(id){ return document.getElementById(id); }

function fmtDate(d){ return d.slice(5).replace("-", "/"); }
function parseDate(s){
  // 输入如 2026-08-19 或 08-19；返回 Date
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

// ---------- 数据加载 ----------
async function loadData(){
  try {
    const [sRes, cRes] = await Promise.all([
      fetch("schedule.json", {cache: "no-store"}),
      fetch("config.json", {cache: "no-store"}),
    ]);
    if (!sRes.ok) throw new Error("schedule.json 加载失败: " + sRes.status);
    schedule = await sRes.json();
    if (cRes.ok) cfg = await cRes.json();
    displayDates = (cfg.display_dates && cfg.display_dates.length) ? cfg.display_dates : Object.keys(schedule).sort();
    // 合并 schedule 中有但 displayDates 没有的日期
    Object.keys(schedule).forEach(d => { if (!displayDates.includes(d)) displayDates.push(d); });
    displayDates.sort();
  } catch (e) {
    schedule = {};
    displayDates = [];
    setStatus("数据加载失败（请确认是通过 https://kayn-qy.github.io/-/editor.html 访问）: " + e.message, true);
  }
}

// ---------- 表格渲染 ----------
function renderTable(){
  // thead
  let headHtml = "<th>场次</th><th>角色</th>";
  displayDates.forEach((d, i) => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    headHtml += `<th class="date-col">${fmtDate(d)}<br><span class="weekday">${wd}</span><span class="del-date" data-del-date="${i}">删除本列</span></th>`;
  });
  $("thead-row").innerHTML = headHtml;

  // tbody：每场次 5 个角色行
  let rows = "";
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn]) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (schedule[d] && schedule[d][slot] && schedule[d][slot][rk] !== undefined) ? schedule[d][slot][rk] : "";
        const cls = rk === "anchor" ? "cell role-anchor" : "cell";
        cells += `<td class="${cls}" contenteditable="true" data-date="${d}" data-slot="${slot}" data-role="${rk}">${escapeHtml(val)}</td>`;
      });
      const rowLabel = rk === "time" ? slot : "";
      rows += `<tr><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td>${cells}</tr>`;
    });
  });
  $("tbody").innerHTML = rows;
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// 单元格 input 事件收集数据
function bindCells(){
  document.querySelectorAll("td.cell").forEach(td => {
    td.addEventListener("input", () => {
      const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
      if (!schedule[d]) schedule[d] = {};
      if (!schedule[d][s]) schedule[d][s] = {};
      schedule[d][s][r] = td.innerText.trim();
    });
  });
}

// ---------- 日期列操作 ----------
function addDateColumn(){
  const input = prompt("输入新日期（格式 2026-08-20，或 08-20）：");
  if (!input) return;
  const dt = parseDate(input.trim());
  if (!dt) { setStatus("日期格式不正确", true); return; }
  const iso = toISO(dt);
  if (displayDates.includes(iso)) { setStatus("该日期已存在", true); return; }
  displayDates.push(iso);
  displayDates.sort();
  if (!schedule[iso]) schedule[iso] = {};
  renderTable(); bindCells();
  setStatus(`已添加日期列 ${iso}`, false);
}
function delDateColumn(i){
  const d = displayDates[i];
  if (!confirm(`确定删除日期列 ${d} 及其全部排班数据？`)) return;
  displayDates.splice(i, 1);
  delete schedule[d];
  renderTable(); bindCells();
  setStatus(`已删除 ${d}`, false);
}
function shiftWeek(days){
  displayDates = displayDates.map(d => { const dt = parseDate(d); return dt ? toISO(addDays(dt, days)) : d; });
  displayDates.sort();
  renderTable(); bindCells();
}

// ---------- 渲染 HTML（复刻 render_web.py） ----------
function renderHtml(updatedAt){
  const counter = {};
  Object.values(schedule).forEach(slots => Object.values(slots).forEach(info => {
    const n = (info.anchor || "").trim();
    if (n) counter[n] = (counter[n] || 0) + 1;
  }));
  const chips = Object.entries(counter).map(([n, c]) => `<span class="stat-chip">主播 ${n} × ${c} 场</span>`).join("") || "<span>暂无数据</span>";

  const dateHeader = displayDates.map(d => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    return `<th class="date-col">${fmtDate(d)}<br><span class="weekday">${wd}</span></th>`;
  }).join("");

  const rows = [];
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn]) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (schedule[d] && schedule[d][slot] && schedule[d][slot][rk] !== undefined) ? schedule[d][slot][rk] : "";
        if (val) {
          const cls = rk === "anchor" ? "role-anchor" : "role-normal";
          cells += `<td class="cell ${cls}">${escapeHtml(val)}</td>`;
        } else {
          cells += `<td class="cell empty"></td>`;
        }
      });
      const rowLabel = rk === "time" ? slot : "";
      rows.push(`<tr><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td>${cells}</tr>`);
    });
  });

  const editBtn = `<a class="edit-btn" href="editor.html" target="_blank">在线编辑</a>`;

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【7X官方直播间】直播排班表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2d3436; }
  .container { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }
  header { text-align: center; padding: 28px 0 20px; }
  header h1 { font-size: 26px; color: #1a1a2e; }
  header p { color: #7f8c8d; margin-top: 8px; font-size: 14px; }
  .edit-btn { display: inline-block; margin-top: 10px; background: #0984e3; color: #fff; text-decoration: none; border-radius: 20px; padding: 7px 18px; font-size: 13px; font-weight: 600; }
  .edit-btn:hover { background: #0873c4; }
  .stat-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .stat-chip { background: #fff; border: 1px solid #e1e5ec; border-radius: 20px; padding: 6px 14px; font-size: 14px; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 16px; }
  table { width: 100%; border-collapse: collapse; min-width: 1200px; }
  th, td { border: 1px solid #e8ecf1; padding: 8px 10px; text-align: center; font-size: 13px; }
  th { background: #0984e3; color: #fff; font-weight: 600; white-space: nowrap; }
  .date-col { min-width: 92px; }
  .weekday { font-size: 11px; font-weight: 400; opacity: .85; }
  .slot-col { background: #f0f4fb; font-weight: 600; color: #0984e3; width: 64px; }
  .role-col { background: #fafbfc; font-weight: 600; width: 76px; font-size: 12px; color: #555; }
  .cell { min-height: 28px; }
  .role-anchor { font-weight: 600; color: #d63031; }
  .empty { background: #fcfcfd; }
  .legend { margin-top: 12px; font-size: 12px; color: #7f8c8d; }
  footer { text-align: center; color: #b2bec3; font-size: 12px; padding: 16px 0 32px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>【7X官方直播间】直播排班表</h1>
    <p>数据更新时间：${updatedAt} · 场次含直播时间/车型/主播/技术/投流</p>
    ${editBtn}
  </header>
  <div class="stat-bar">${chips}</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>场次</th><th>角色</th>${dateHeader}</tr>
      </thead>
      <tbody>${rows.join("")}</tbody>
    </table>
    <div class="legend">红色为主播 · 空白为未排班（周末/节假日/未填写）</div>
  </div>
  <footer>Generated by Marvis Schedule Reminder</footer>
</div>
</body>
</html>`;
}

// ---------- 保存到 GitHub ----------
function getToken(){
  let t = localStorage.getItem("gh_token") || "";
  return t.trim();
}
function setStatus(msg, isErr){
  const el = $("save-status");
  el.textContent = msg;
  el.className = isErr ? "err" : "";
}
async function ghGetSha(path){
  const token = getToken();
  const r = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) {
    if (r.status === 404) return null;
    throw new Error(`获取 ${path} 失败: HTTP ${r.status}`);
  }
  const j = await r.json();
  return j.sha || null;
}
async function ghPut(path, content){
  const token = getToken();
  const sha = await ghGetSha(path);
  const body = { message: "在线编辑排班表", content: btoa(unescape(encodeURIComponent(content))) };
  if (sha) body.sha = sha;
  const r = await fetch(API + path, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); msg = (j.message || "") + (j.errors ? " " + JSON.stringify(j.errors) : ""); } catch(e){}
    throw new Error(`更新 ${path} 失败: ${msg}`);
  }
  return true;
}

async function save(){
  // 1. 收集数据（从 DOM 确保最新）
  document.querySelectorAll("td.cell").forEach(td => {
    const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
    if (!schedule[d]) schedule[d] = {};
    if (!schedule[d][s]) schedule[d][s] = {};
    schedule[d][s][r] = td.innerText.trim();
  });
  // 2. 过滤空条目
  const clean = {};
  Object.keys(schedule).sort().forEach(d => {
    const slots = {};
    Object.keys(schedule[d]).forEach(s => {
      const info = {};
      let has = false;
      ROLES.forEach(([rk]) => {
        const v = (schedule[d][s][rk] || "").trim();
        info[rk] = v;
        if (v) has = true;
      });
      if (has) slots[s] = info;
    });
    if (Object.keys(slots).length) clean[d] = slots;
  });
  schedule = clean;

  // 3. 更新 config display_dates
  cfg.display_dates = displayDates.slice();

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const updatedAt = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const html = renderHtml(updatedAt);

  // 4. token 检查
  if (!getToken()) {
    $("token-bar").style.display = "block";
    setStatus("请先输入 GitHub Token 后保存", true);
    $("token-input").focus();
    return;
  }

  setStatus("正在保存并发布…", false);
  const btn = $("btn-save");
  btn.disabled = true;
  try {
    await ghPut("schedule.json", JSON.stringify(schedule, null, 2) + "\n");
    await ghPut("config.json", JSON.stringify(cfg, null, 2) + "\n");
    await ghPut("index.html", html);
    await ghPut("output/schedule.html", html);
    setStatus("保存成功！GitHub Pages 约 1~2 分钟后自动更新，可点「查看网页」确认。", false);
  } catch (e) {
    setStatus(e.message, true);
    if (/Bad credentials|401/.test(e.message)) {
      $("token-bar").style.display = "block";
    }
  } finally {
    btn.disabled = false;
  }
}

// ---------- 事件绑定 ----------
function init(){
  $("btn-add-date").addEventListener("click", addDateColumn);
  $("btn-prev-week").addEventListener("click", () => shiftWeek(-7));
  $("btn-next-week").addEventListener("click", () => shiftWeek(7));
  $("btn-save").addEventListener("click", save);
  $("btn-token-save").addEventListener("click", () => {
    const t = $("token-input").value.trim();
    if (!t) { setStatus("Token 不能为空", true); return; }
    localStorage.setItem("gh_token", t);
    $("token-bar").style.display = "none";
    $("token-input").value = "";
    setStatus("Token 已保存（仅本浏览器有效）", false);
  });
  $("btn-token-clear").addEventListener("click", () => {
    localStorage.removeItem("gh_token");
    $("token-input").value = "";
    setStatus("Token 已清除", false);
  });
  // 删除日期列（事件委托）
  document.addEventListener("click", e => {
    const del = e.target.closest(".del-date");
    if (del) delDateColumn(parseInt(del.dataset.delDate, 10));
  });
}

(async function main(){
  await loadData();
  renderTable();
  bindCells();
  init();
  if (getToken()) { $("token-bar").style.display = "none"; }
})();
</script>
</body>
</html>
