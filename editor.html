<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班表 · 在线编辑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wandor-dark: #0a0a0a;
  --wandor-text: #1a1a1a;
  --wandor-muted: #767676;
  --wandor-prompt: #905831;
  --font-sans: "Geist", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-display: "Special Elite", "PingFang SC", serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}
body{font-family:var(--font-sans);background:#fff;color:var(--wandor-text);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
.hero-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.top-overlay{position:fixed;inset-x:0;top:0;height:687px;background:linear-gradient(180deg,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 100%);pointer-events:none;z-index:1}
nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:28px 80px 16px}
.wordmark{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--wandor-text);user-select:none;letter-spacing:.02em}
.nav-actions{display:flex;align-items:center;gap:20px}
.btn-dark{display:inline-flex;align-items:center;background:var(--wandor-dark);color:#fafafa;border:none;cursor:pointer;font-family:var(--font-sans);font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;padding:14px 20px;border-radius:999px;text-decoration:none;transition:background-color .2s,transform .15s;white-space:nowrap}
.btn-dark:hover{background:#333}
.btn-dark:active{transform:scale(.95)}
.btn-dark:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:none;cursor:pointer;font-family:var(--font-sans);font-size:15px;font-weight:600;text-transform:uppercase;color:#292929;letter-spacing:.04em;text-decoration:none;transition:opacity .2s;white-space:nowrap}
.btn-ghost:hover{opacity:.55}
.btn-outline{display:inline-flex;align-items:center;background:transparent;border:1px solid rgba(26,26,26,.22);color:var(--wandor-text);cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:500;border-radius:999px;padding:10px 18px;text-decoration:none;transition:border-color .2s,background .2s;white-space:nowrap}
.btn-outline:hover{border-color:rgba(144,88,49,.55);background:rgba(255,255,255,.5)}
.content{position:relative;z-index:2;max-width:1680px;margin:0 auto;padding:32px 80px 80px}
.glass-card{background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.65);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.18);padding:36px 40px;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.card-head{margin-bottom:24px}
.card-head h1{font-size:clamp(22px,2.8vw,30px);font-weight:700;letter-spacing:-.01em;line-height:1.15}
.card-head .sub{margin-top:8px;font-size:14px;color:var(--wandor-muted)}
.card-head .sub time{color:var(--wandor-text);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
#save-status{font-size:13px;color:var(--wandor-prompt);min-height:18px;margin-top:12px}
#save-status.err{color:#c0392b}
.token-bar{background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.65);border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.12);padding:18px 22px;margin:20px 0 0;max-width:880px;font-size:13px;color:var(--wandor-muted);display:none;position:relative;z-index:2}
.token-bar b{color:var(--wandor-text)}
.token-bar input{width:100%;padding:10px 14px;border:1px solid rgba(26,26,26,.18);border-radius:999px;margin-top:10px;font-size:13px;background:rgba(255,255,255,.7);color:var(--wandor-text);outline:none;font-family:var(--font-sans)}
.token-bar input:focus{border-color:var(--wandor-prompt)}
.token-bar .token-actions{display:flex;gap:8px;margin-top:10px}
.token-bar button{border:1px solid rgba(26,26,26,.22);background:transparent;color:var(--wandor-text);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--font-sans);transition:border-color .2s}
.token-bar button:hover{border-color:var(--wandor-prompt)}
.token-bar button.btn-primary{background:var(--wandor-dark);color:#fafafa;border-color:transparent;font-weight:500}
.token-bar button.btn-primary:hover{background:#333}
.board{margin-top:10px}
.board-scroll{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:1500px;font-size:13px}
thead th{background:rgba(255,255,255,.55);color:var(--wandor-text);font-weight:600;padding:13px 10px;border-bottom:1px solid rgba(26,26,26,.10);white-space:nowrap}
.date-col{min-width:104px;color:var(--wandor-text);font-weight:500}
.date-col .wd{display:block;font-size:11px;color:var(--wandor-muted);font-weight:400;margin-top:3px}
.date-col .del-date{display:inline-block;margin-top:5px;font-size:11px;font-weight:400;cursor:pointer;color:var(--wandor-muted);text-decoration:underline;opacity:.8;transition:color .15s}
.date-col .del-date:hover{color:#c0392b}
td{border-bottom:1px solid rgba(26,26,26,.07);padding:9px 8px;text-align:center;color:var(--wandor-text);vertical-align:middle;transition:background .15s}
.row-slot td{border-top:1px solid rgba(26,26,26,.12)}
.slot-col{width:72px;color:var(--wandor-muted);font-weight:500}
.slot-badge{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:4px 9px;border-radius:999px;background:rgba(144,88,49,.12);color:var(--wandor-prompt);font-weight:600;font-size:12px}
.role-col{width:86px;color:var(--wandor-muted);font-size:12px;font-weight:500}
td.cell{min-width:92px;min-height:28px;outline:none;cursor:text}
td.cell:hover{background:rgba(144,88,49,.06)}
td.cell:focus{background:rgba(144,88,49,.12);box-shadow:inset 0 0 0 1.5px var(--wandor-prompt)}
td.cell.anchor{color:var(--wandor-prompt);font-weight:600}
td.cell.empty{color:rgba(26,26,26,.22)}
.board-note{margin-top:14px;font-size:12px;color:var(--wandor-muted);padding:0 6px 6px}
.foot{position:relative;z-index:2;text-align:center;color:rgba(26,26,26,.5);font-size:12px;letter-spacing:.10em;padding:28px 0 4px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
  nav{padding:20px 24px 14px}
  .wordmark{font-size:32px}
  .content{padding:24px 16px 48px}
  .glass-card{padding:20px 16px;border-radius:18px}
}
@media (max-width:640px){
  .nav-actions{gap:10px}
  .btn-dark{padding:11px 16px;font-size:13px}
  .btn-ghost{display:none}
}
</style>
</head>
<body>
<video class="hero-video" id="hero-video"></video>
<div class="top-overlay"></div>

<nav>
  <span class="wordmark">7X OPS</span>
  <div class="nav-actions">
    <a class="btn-ghost" href="index.html" target="_blank">查看网页</a>
    <button class="btn-dark" id="btn-save">保存并发布</button>
  </div>
</nav>

<main class="content">
  <section class="glass-card">
    <header class="card-head">
      <h1>直播排班表 · 在线编辑</h1>
      <p class="sub">点击单元格直接编辑 · 保存后自动更新公开网页（GitHub Pages 约 1~2 分钟后生效）</p>
      <div class="toolbar">
        <button class="btn-dark" id="btn-add-date">＋ 新增日期列</button>
        <button class="btn-outline" id="btn-prev-week">上周</button>
        <button class="btn-outline" id="btn-next-week">下周</button>
      </div>
      <div id="save-status"></div>
    </header>

    <div class="board">
      <div class="board-scroll">
        <table id="edit-table">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="board-note">赤陶色为主播 · 点击「删除本列」可移除日期列</div>
    </div>
  </section>

  <div class="token-bar" id="token-bar">
    <div><b>首次保存需要 GitHub Token</b>（Fine-grained PAT，仅授权本仓库 Contents 读写权限）。Token 仅保存在当前浏览器的本地存储中，不会写入公开页面。换浏览器/设备需重新输入。</div>
    <input type="password" id="token-input" placeholder="粘贴 GitHub Token（ghp_ 或 github_pat_ 开头）">
    <div class="token-actions">
      <button class="btn-primary" id="btn-token-save">保存 Token</button>
      <button id="btn-token-clear">清除 Token</button>
    </div>
  </div>

  <footer class="foot">7X LIVE OPS CONSOLE · Marvis Schedule Reminder</footer>
</main>

<script>
"use strict";
const REPO_OWNER = "Kayn-QY";
const REPO_NAME = "-";
const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
const WEEKDAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const ROLES = [
  ["time", "直播时间"],
  ["car", "直播车型"],
  ["anchor", "主播"],
  ["tech", "技术"],
  ["ad", "投流"],
];
const SLOT_ORDER = ["第1场","第2场","第3场","第4场","第5场","第6场"];
const VIDEO_SRC = "https://pollen-batch-41236914.figma.site/_components/v2/f0ee2dae7671c170c34f12e31c4cb41418976c98/769c564298c132f7919405cd9f17c1b1231f341d.769c5642.mp4";

let schedule = {};
let displayDates = [];
let cfg = {};

function $(id){ return document.getElementById(id); }
function fmtDate(d){ return d.slice(5).replace("-", "/"); }
function parseDate(s){
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

async function loadData(){
  try {
    const [sRes, cRes] = await Promise.all([
      fetch("schedule.json", {cache: "no-store"}),
      fetch("config.json", {cache: "no-store"}),
    ]);
    if (!sRes.ok) throw new Error("schedule.json 加载失败: " + sRes.status);
    schedule = await sRes.json();
    if (cRes.ok) cfg = await cRes.json();
    displayDates = (cfg.display_dates && cfg.display_dates.length) ? cfg.display_dates : Object.keys(schedule).sort();
    Object.keys(schedule).forEach(d => { if (!displayDates.includes(d)) displayDates.push(d); });
    displayDates.sort();
  } catch (e) {
    schedule = {};
    displayDates = [];
    setStatus("数据加载失败（请确认是通过 https://kayn-qy.github.io/-/editor.html 访问）: " + e.message, true);
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderTable(){
  let headHtml = '<th class="col-slot">场次</th><th class="col-role">角色</th>';
  displayDates.forEach((d, i) => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    headHtml += `<th class="date-col">${fmtDate(d)}<span class="wd">${wd}</span><span class="del-date" data-del-date="${i}">删除本列</span></th>`;
  });
  $("thead-row").innerHTML = headHtml;

  let rows = "";
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn], ri) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (schedule[d] && schedule[d][slot] && schedule[d][slot][rk] !== undefined) ? schedule[d][slot][rk] : "";
        const cls = rk === "anchor" ? "cell anchor" : "cell" + (val ? "" : " empty");
        cells += `<td class="${cls}" contenteditable="true" data-date="${d}" data-slot="${slot}" data-role="${rk}">${escapeHtml(val)}</td>`;
      });
      const rowLabel = rk === "time" ? `<span class="slot-badge">${slot}</span>` : "";
      const trCls = rk === "time" ? ' class="row-slot"' : "";
      rows += `<tr${trCls}><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td>${cells}</tr>`;
    });
  });
  $("tbody").innerHTML = rows;
}

function bindCells(){
  document.querySelectorAll("td.cell").forEach(td => {
    td.addEventListener("input", () => {
      const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
      if (!schedule[d]) schedule[d] = {};
      if (!schedule[d][s]) schedule[d][s] = {};
      schedule[d][s][r] = td.innerText.trim();
      td.classList.toggle("empty", !td.innerText.trim());
    });
  });
}

function addDateColumn(){
  const input = prompt("输入新日期（格式 2026-08-20，或 08-20）：");
  if (!input) return;
  const dt = parseDate(input.trim());
  if (!dt) { setStatus("日期格式不正确", true); return; }
  const iso = toISO(dt);
  if (displayDates.includes(iso)) { setStatus("该日期已存在", true); return; }
  displayDates.push(iso);
  displayDates.sort();
  if (!schedule[iso]) schedule[iso] = {};
  renderTable(); bindCells();
  setStatus(`已添加日期列 ${iso}`, false);
}
function delDateColumn(i){
  const d = displayDates[i];
  if (!confirm(`确定删除日期列 ${d} 及其全部排班数据？`)) return;
  displayDates.splice(i, 1);
  delete schedule[d];
  renderTable(); bindCells();
  setStatus(`已删除 ${d}`, false);
}
function shiftWeek(days){
  displayDates = displayDates.map(d => { const dt = parseDate(d); return dt ? toISO(addDays(dt, days)) : d; });
  displayDates.sort();
  renderTable(); bindCells();
}

function renderHtml(updatedAt){
  const counter = {};
  Object.values(schedule).forEach(slots => Object.values(slots).forEach(info => {
    const n = (info.anchor || "").trim();
    if (n) counter[n] = (counter[n] || 0) + 1;
  }));
  const chips = Object.entries(counter).map(([n, c]) => `<span class="chip">主播 <b>${escapeHtml(n)}</b> × ${c} 场</span>`).join("") || '<span class="chip">暂无数据</span>';

  const dateHeader = displayDates.map(d => {
    const dt = parseDate(d);
    const wd = dt ? WEEKDAYS[dt.getDay()] : "";
    return `<th class="date-col">${fmtDate(d)}<span class="wd">${wd}</span></th>`;
  }).join("");

  const rows = [];
  SLOT_ORDER.forEach(slot => {
    ROLES.forEach(([rk, rn]) => {
      let cells = "";
      displayDates.forEach(d => {
        const val = (schedule[d] && schedule[d][slot] && schedule[d][slot][rk] !== undefined) ? schedule[d][slot][rk] : "";
        if (val) {
          const cls = rk === "anchor" ? "cell anchor" : "cell";
          cells += `<td class="${cls}">${escapeHtml(val)}</td>`;
        } else {
          cells += '<td class="cell empty"><span class="void">·</span></td>';
        }
      });
      const rowLabel = rk === "time" ? `<span class="slot-badge">${slot}</span>` : "";
      const trCls = rk === "time" ? ' class="row-slot"' : "";
      rows.push(`<tr${trCls}><td class="slot-col">${rowLabel}</td><td class="role-col">${rn}</td>${cells}</tr>`);
    });
  });

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【7X官方直播间】直播排班表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${CSS_VIEW}</style>
</head>
<body>
<video class="hero-video" src="${VIDEO_SRC}" autoplay muted loop playsinline></video>
<div class="top-overlay"></div>

<nav>
  <span class="wordmark">7X OPS</span>
  <div class="nav-links">
    <a class="nav-link" href="#stats">Stats</a>
    <a class="nav-link" href="#schedule">Schedule</a>
    <a class="nav-link" href="#help">Help</a>
  </div>
  <div class="nav-actions">
    <a class="btn-dark" href="editor.html" target="_blank">在线编辑</a>
  </div>
</nav>

<main class="content">
  <section class="glass-card" id="schedule">
    <header class="card-head">
      <div>
        <h1>【7X官方直播间】直播排班表</h1>
        <p class="sub">数据更新 <time>${updatedAt}</time></p>
      </div>
      <div class="stats" id="stats">${chips}</div>
    </header>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th class="col-slot">场次</th><th class="col-role">角色</th>${dateHeader}</tr>
        </thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
    <div class="note" id="help">
      <span>赤陶色为主播 · 圆点为未排班（周末/节假日/未填写）</span>
      <span class="tag">Wandor Style · Marvis Schedule</span>
    </div>
  </section>
</main>
</body>
</html>`;
}

function getToken(){
  return (localStorage.getItem("gh_token") || "").trim();
}
function setStatus(msg, isErr){
  const el = $("save-status");
  el.textContent = msg;
  el.className = isErr ? "err" : "";
}
async function ghGetSha(path){
  const token = getToken();
  const r = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) {
    if (r.status === 404) return null;
    throw new Error(`获取 ${path} 失败: HTTP ${r.status}`);
  }
  const j = await r.json();
  return j.sha || null;
}
async function ghPut(path, content){
  const token = getToken();
  const sha = await ghGetSha(path);
  const body = { message: "在线编辑排班表", content: btoa(unescape(encodeURIComponent(content))) };
  if (sha) body.sha = sha;
  const r = await fetch(API + path, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); msg = (j.message || "") + (j.errors ? " " + JSON.stringify(j.errors) : ""); } catch(e){}
    throw new Error(`更新 ${path} 失败: ${msg}`);
  }
  return true;
}

async function save(){
  document.querySelectorAll("td.cell").forEach(td => {
    const d = td.dataset.date, s = td.dataset.slot, r = td.dataset.role;
    if (!schedule[d]) schedule[d] = {};
    if (!schedule[d][s]) schedule[d][s] = {};
    schedule[d][s][r] = td.innerText.trim();
  });
  const clean = {};
  Object.keys(schedule).sort().forEach(d => {
    const slots = {};
    Object.keys(schedule[d]).forEach(s => {
      const info = {};
      let has = false;
      ROLES.forEach(([rk]) => {
        const v = (schedule[d][s][rk] || "").trim();
        info[rk] = v;
        if (v) has = true;
      });
      if (has) slots[s] = info;
    });
    if (Object.keys(slots).length) clean[d] = slots;
  });
  schedule = clean;

  cfg.display_dates = displayDates.slice();

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const updatedAt = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const html = renderHtml(updatedAt);

  if (!getToken()) {
    $("token-bar").style.display = "block";
    setStatus("请先输入 GitHub Token 后保存", true);
    $("token-input").focus();
    return;
  }

  setStatus("正在保存并发布…", false);
  const btn = $("btn-save");
  btn.disabled = true;
  try {
    await ghPut("schedule.json", JSON.stringify(schedule, null, 2) + "\n");
    await ghPut("config.json", JSON.stringify(cfg, null, 2) + "\n");
    await ghPut("index.html", html);
    await ghPut("output/schedule.html", html);
    setStatus("保存成功！GitHub Pages 约 1~2 分钟后自动更新，可点「查看网页」确认。", false);
  } catch (e) {
    setStatus(e.message, true);
    if (/Bad credentials|401/.test(e.message)) {
      $("token-bar").style.display = "block";
    }
  } finally {
    btn.disabled = false;
  }
}

function init(){
  const video = $("hero-video");
  video.src = VIDEO_SRC;
  video.autoplay = true; video.muted = true; video.loop = true; video.playsInline = true;
  $("btn-add-date").addEventListener("click", addDateColumn);
  $("btn-prev-week").addEventListener("click", () => shiftWeek(-7));
  $("btn-next-week").addEventListener("click", () => shiftWeek(7));
  $("btn-save").addEventListener("click", save);
  $("btn-token-save").addEventListener("click", () => {
    const t = $("token-input").value.trim();
    if (!t) { setStatus("Token 不能为空", true); return; }
    localStorage.setItem("gh_token", t);
    $("token-bar").style.display = "none";
    $("token-input").value = "";
    setStatus("Token 已保存（仅本浏览器有效）", false);
  });
  $("btn-token-clear").addEventListener("click", () => {
    localStorage.removeItem("gh_token");
    $("token-input").value = "";
    setStatus("Token 已清除", false);
  });
  document.addEventListener("click", e => {
    const del = e.target.closest(".del-date");
    if (del) delDateColumn(parseInt(del.dataset.delDate, 10));
  });
}

(async function main(){
  await loadData();
  renderTable();
  bindCells();
  init();
  if (getToken()) { $("token-bar").style.display = "none"; }
})();
</script>
</body>
